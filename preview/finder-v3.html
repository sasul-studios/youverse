<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouFinder - Youverse</title>
<link rel="icon" href="img/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Almarai:wght@400;700;800&family=Lora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;overflow-x:clip}
body{background:#03060E;color:#EAF4F6;font-family:Almarai,sans-serif;min-height:100vh}
.ys{background:rgba(255,255,255,.94)!important}
html[lang=en] body{font-family:Almarai,sans-serif}
h1,h2,.serif{font-family:Amiri,serif}html[lang=en] h1,html[lang=en] h2,html[lang=en] .serif{font-family:Lora,serif}
a{color:inherit}button{font:inherit;color:inherit}

/* the sky: stars drawn once on canvases, the layers drift very slowly */
#sky{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 80% 60% at 70% 10%,rgba(60,90,160,.18),transparent 60%),radial-gradient(ellipse 60% 50% at 10% 80%,rgba(120,70,150,.14),transparent 60%),#03060E}
#sky canvas{position:absolute;left:-5%;top:-5%;width:110%;height:110%}
#s1{animation:drift 140s linear infinite alternate}#s2{animation:drift 90s linear infinite alternate-reverse;opacity:.9}
#s3{animation:tw 5s ease-in-out infinite}
@keyframes drift{to{transform:translate3d(-2.5%,1.5%,0)}}@keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){#sky canvas{animation:none!important}.star,.star i{animation:none!important}}
main{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:48px 32px 90px}

.top h1{font-size:clamp(40px,5vw,64px);margin:0;line-height:1.25;color:#fff;text-shadow:0 0 40px rgba(92,225,230,.25)}
.top p{margin:10px 0 0;color:rgba(234,244,246,.72);font-size:17px;line-height:1.8;max-width:640px}
.ctrl{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin:28px 0 8px}
.chips{display:flex;gap:8px;overflow-x:auto;min-width:0;max-width:100%;scrollbar-width:none;padding:4px 2px}.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 16px;border-radius:30px;border:1px solid rgba(234,244,246,.18);background:rgba(255,255,255,.04);font-weight:700;font-size:14px;cursor:pointer;transition:background .2s,border-color .2s,color .2s}
.chip:hover{border-color:rgba(234,244,246,.4)}
.chip[aria-pressed=true]{background:#5CE1E6;border-color:#5CE1E6;color:#032E36}
.chip.mine{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 0 18px -4px var(--c)}
.chip.mine b{font-size:11px;background:var(--c);color:#03060E;border-radius:20px;padding:2px 7px}
.view{display:flex;padding:4px;border-radius:30px;border:1px solid rgba(234,244,246,.18);background:rgba(255,255,255,.04)}
.view button{border:0;background:none;height:34px;padding:0 16px;border-radius:30px;font-weight:700;font-size:13px;cursor:pointer;color:rgba(234,244,246,.7)}
.view button[aria-pressed=true]{background:rgba(234,244,246,.12);color:#fff}

/* regions */
.region{position:relative;margin-top:46px;padding:34px 34px 30px;border-radius:30px;border:1px solid rgba(234,244,246,.07);background:radial-gradient(ellipse 70% 90% at 85% 0%,color-mix(in srgb,var(--c) 13%,transparent),transparent 70%),rgba(8,14,28,.42);transition:opacity .4s,transform .4s}
.region.mine{border-color:color-mix(in srgb,var(--c) 45%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 30%,transparent),0 30px 90px -40px var(--c)}
.region.dim{opacity:.28}
.rh{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px 16px;justify-content:space-between}
.rh h2{margin:0;font-size:clamp(30px,3.4vw,42px);color:#fff;line-height:1.3;display:flex;align-items:center;gap:12px}
.rh h2 .ic{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid color-mix(in srgb,var(--c) 50%,transparent);background:color-mix(in srgb,var(--c) 12%,transparent);color:var(--c);flex-shrink:0}
.rh .lt{font-size:13px;font-weight:800;color:var(--c);margin-top:4px}
.rh .mine-tag{font-size:12px;font-weight:800;color:#03060E;background:var(--c);border-radius:20px;padding:3px 10px}
.rh p{margin:8px 0 0;color:rgba(234,244,246,.7);font-size:15px;line-height:1.7;flex-basis:100%}

/* characters: floating cluster on laptops, a swipeable row on phones */
.stars{position:relative;height:250px;margin-top:10px}
.star{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:8px;border:0;background:none;cursor:pointer;padding:6px;border-radius:20px;animation:float var(--f) ease-in-out var(--d) infinite}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -9px}}
.star i{display:flex;align-items:center;justify-content:center;width:var(--s);height:var(--s);border-radius:50%;background:radial-gradient(circle at 50% 38%,#16283A,#070D18 75%);border:1.5px solid var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 10%,transparent),0 0 26px -2px var(--c);font-style:normal;font-family:Amiri,serif;font-weight:700;font-size:calc(var(--s) * .4);color:#fff;transition:transform .25s,box-shadow .25s;overflow:hidden}
.star i img{width:100%;height:100%;object-fit:cover;filter:saturate(.85) sepia(.12) hue-rotate(140deg)}
.star span{font-size:12.5px;color:rgba(234,244,246,.75);white-space:nowrap}
.star:hover i,.star:focus-visible i,.star.on i{transform:scale(1.12);box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 22%,transparent),0 0 44px 2px var(--c)}
.star:focus-visible{outline:2px solid var(--c);outline-offset:4px}
.soon{position:relative;height:150px;display:flex;align-items:center;justify-content:center;gap:16px;color:rgba(234,244,246,.55);font-size:15px}
.soon i{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c);opacity:.6;animation:tw 3s ease-in-out infinite}.soon i:nth-child(2){animation-delay:.6s;width:5px;height:5px}.soon i:nth-child(4){animation-delay:1.2s}

/* preview card */
.peek{position:absolute;z-index:5;width:300px;padding:18px;border-radius:22px;background:rgba(10,18,32,.92);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);box-shadow:0 30px 60px -20px rgba(0,0,0,.7),0 0 40px -16px var(--c);display:flex;gap:14px;align-items:center;opacity:0;visibility:hidden;left:0;top:0;transform:translateY(8px) scale(.98);pointer-events:none;transition:opacity .2s,transform .2s,visibility 0s .2s}
.peek.on{opacity:1;visibility:visible;transform:none;pointer-events:auto;transition:opacity .2s,transform .2s}
.peek .av{width:62px;height:62px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--c);font-family:Amiri,serif;font-weight:700;font-size:24px;background:#0B1626}
.peek b{display:block;font-size:16px;color:#fff}.peek small{display:block;color:rgba(234,244,246,.7);font-size:13px;line-height:1.6;margin:3px 0 10px}
.peek a{display:inline-flex;align-items:center;gap:6px;text-decoration:none;background:var(--c);color:#03060E;font-weight:800;font-size:13.5px;padding:9px 16px;border-radius:20px}
.peek .x{position:absolute;top:8px;inset-inline-end:8px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(255,255,255,.08);cursor:pointer;font-size:15px}

/* list view */
.list{display:none;margin-top:30px}
body.listing .list{display:block}body.listing .space{display:none}
.lg{margin-bottom:30px}.lg h2{font-size:28px;margin:0 0 4px;color:#fff;display:flex;align-items:center;gap:10px}.lg h2 svg{color:var(--c)}
.lg ul{list-style:none;margin:12px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.lg li a{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid rgba(234,244,246,.08);text-decoration:none}
.lg li a:hover,.lg li a:focus-visible{border-color:var(--c);outline:none}
.lg li .av{width:42px;height:42px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--c);font-family:Amiri,serif;font-weight:700;background:#0B1626}
.lg li small{display:block;color:rgba(234,244,246,.6);font-size:12.5px}
.lg .none{color:rgba(234,244,246,.5);font-size:14px;margin-top:8px}

@media (max-width:760px){
 main{padding:30px 16px 70px}.top p{font-size:15.5px}
 .ctrl{flex-direction:column;align-items:stretch}.view{align-self:flex-start}
 .region{padding:24px 18px 20px;border-radius:24px;margin-top:28px}
 .stars{height:auto;display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:14px 4px 8px;margin:10px -18px 0;padding-inline:18px;scrollbar-width:none}.stars::-webkit-scrollbar{display:none}
 .star{position:static;transform:none;animation:none;scroll-snap-align:start;flex-shrink:0;--s:66px!important}
 .peek{position:fixed;left:12px!important;right:12px!important;top:auto!important;bottom:16px;width:auto}
}
</style>
</head>
<body>
<div id="sky"><canvas id="s1"></canvas><canvas id="s2"></canvas><canvas id="s3"></canvas></div>
<div id="yv-shell" data-page="finder"></div>
<main>
 <div class="top"><h1 id="h1"></h1><p id="sub"></p></div>
 <div class="ctrl"><div class="chips" id="chips" role="group"></div>
  <div class="view" role="group"><button id="vSpace" aria-pressed="true"></button><button id="vList" aria-pressed="false"></button></div></div>
 <div class="space" id="space"></div>
 <div class="list" id="list"></div>
</main>
<div class="peek" id="peek" role="dialog" aria-modal="false"><button class="x" aria-label="close">×</button><div class="av" id="pav"></div><div><b id="pn"></b><small id="pl"></small><a id="pgo" href="#"></a></div></div>

<script src="test-data.js"></script>
<script src="yv-icons.js"></script>
<script src="yv-shell.js"></script>
<script src="progress.js" defer></script>
<script>
const SH=window.YV_SHELL,en=SH.en,lang=en?'en':'ar',D=window.YV_TEST,L=D[lang].lights,C=D.COLORS,ORDER=['H','F','O','S','C'];
document.documentElement.lang=lang;document.documentElement.dir=en?'ltr':'rtl';
const T=en?{h1:'Find your world',sub:'Every Light has its own sky, and every character has a story waiting for you. Pick a star and step into their world.',all:'All',yours:'Yours',light:'Light',space:'Space view',list:'List view',go:'Enter their world',soon:'Coming soon',none:'No characters yet.',name:'[Name]',line:'[One line about this character]',title:'YouFinder - Youverse'}
          :{h1:'اعثر على عالمك',sub:'لكل ضوء سماؤه، ولكل شخصية قصة تنتظرك. اختر نجمة وادخل عالمها.',all:'الكل',yours:'ضوؤك',light:'ضوء',space:'عرض الفضاء',list:'عرض القائمة',go:'ادخل عالمه',soon:'قريباً',none:'لا توجد شخصيات بعد.',name:'[الاسم]',line:'[سطر واحد عن الشخصية]',title:'YouFinder - Youverse'};
document.title=T.title;$=s=>document.querySelector(s);
$('#h1').textContent=T.h1;$('#sub').textContent=T.sub;$('#vSpace').textContent=T.space;$('#vList').textContent=T.list;

/* placeholder characters until the client sends real people (with written consent for every photo) */
const AR='أبجدهوزحطيكلمنسعفصقرشت',EN='ABCDEFGHIJKLMNOPQRSTUVW';
const COUNT={H:4,F:3,O:3,S:4,C:0};let n=0;
const PEOPLE={};ORDER.forEach(k=>{PEOPLE[k]=[...Array(COUNT[k])].map(()=>({ini:(en?EN:AR)[n++],name:T.name,line:T.line,photo:null,href:SH.APP+(en?'#masterclass-en':'#masterclass')}));});

const mine=ORDER.includes(SH.light)?SH.light:null;
const order=mine?[mine,...ORDER.filter(k=>k!==mine)]:ORDER;
let filter='all';
const pos={4:[[22,32],[48,62],[72,30],[88,68]],3:[[28,58],[55,28],[80,62]],2:[[35,45],[68,55]],1:[[50,48]]};
const face=p=>p.photo?`<img src="${p.photo}" alt="">`:p.ini;
function build(){setTimeout(()=>YVLater(document.querySelector('main'),en));
 $('#chips').innerHTML=`<button class="chip" data-f="all" aria-pressed="${filter==='all'}">${T.all}</button>`+order.map(k=>`<button class="chip${k===mine?' mine':''}" style="--c:${C[k]}" data-f="${k}" aria-pressed="${filter===k}">${YVI(k,16,filter===k?'#032E36':C[k])}${L[k].name}${k===mine?`<b>${T.yours}</b>`:''}</button>`).join('');
 $('#space').innerHTML=order.map((k,ri)=>{const ps=PEOPLE[k],P=pos[Math.min(ps.length,4)]||[];
  return `<section class="region${k===mine?' mine':''}${filter!=='all'&&filter!==k?' dim':''}" style="--c:${C[k]}" data-r="${k}" aria-labelledby="r${k}">
  <div class="rh"><div><h2 id="r${k}"><span class="ic">${YVI(k,24)}</span>${L[k].world}</h2><div class="lt">${T.light} ${L[k].name}</div></div>${k===mine?`<span class="mine-tag">${T.yours}</span>`:''}<p>${L[k].worldDesc}</p></div>
  ${ps.length?`<div class="stars">${ps.map((p,i)=>`<button class="star" style="--c:${C[k]};--x:${en?P[i][0]:100-P[i][0]}%;--y:${P[i][1]}%;--s:${i%2?74:84}px;--f:${6+i%3}s;--d:${-i*1.3}s" data-r="${k}" data-i="${i}" aria-label="${p.name}"><i>${face(p)}</i><span>${p.name}</span></button>`).join('')}</div>`
   :`<div class="soon" style="--c:${C[k]}"><i></i><i></i><span>${T.soon}</span><i></i></div>`}</section>`;}).join('');
 $('#list').innerHTML=order.filter(k=>filter==='all'||filter===k).map(k=>`<div class="lg" style="--c:${C[k]}"><h2>${YVI(k,22)}${L[k].world}</h2><div class="lt" style="color:${C[k]};font-size:13px;font-weight:800">${T.light} ${L[k].name}</div>
  ${PEOPLE[k].length?`<ul>${PEOPLE[k].map(p=>`<li><a href="${p.href}"><span class="av">${face(p)}</span><span><b>${p.name}</b><small>${p.line}</small></span></a></li>`).join('')}</ul>`:`<div class="none">${T.none}</div>`}</div>`).join('');}
build();YVLater(document.querySelector('main'),en);
document.addEventListener('click',e=>{
 const c=e.target.closest('.chip');if(c){filter=c.dataset.f;build();closePeek();
  if(filter!=='all'){const r=document.querySelector('.region[data-r="'+filter+'"]');if(r&&!document.body.classList.contains('listing'))r.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'start'});}return;}
 const s=e.target.closest('.star');if(s){openPeek(s);return;}
 if(e.target.closest('.peek .x')||!e.target.closest('.peek'))closePeek();});
addEventListener('keydown',e=>{if(e.key==='Escape')closePeek();});
$('#vSpace').onclick=()=>setView(false);$('#vList').onclick=()=>setView(true);
function setView(l){document.body.classList.toggle('listing',l);$('#vSpace').setAttribute('aria-pressed',!l);$('#vList').setAttribute('aria-pressed',l);closePeek();}
let lastStar=null;
function openPeek(s){const k=s.dataset.r,p=PEOPLE[k][+s.dataset.i],pk=$('#peek');
 document.querySelectorAll('.star.on').forEach(x=>x.classList.remove('on'));s.classList.add('on');lastStar=s;
 pk.style.setProperty('--c',C[k]);$('#pav').innerHTML=face(p);$('#pav').style.borderColor=C[k];$('#pn').textContent=p.name;$('#pl').textContent=p.line;YVLater($('#peek'),en);
 const go=$('#pgo');go.href=p.href;go.innerHTML=T.go+' '+YVI('play',11,'#03060E',2.4);
 if(innerWidth>760){const r=s.getBoundingClientRect(),W=300;let x=r.left+r.width/2-W/2+scrollX;x=Math.max(16,Math.min(x,innerWidth-W-16));
  pk.style.left=x+'px';pk.style.top=(r.bottom+scrollY+8)+'px';}
 pk.classList.add('on');go.focus({preventScroll:true});}
function closePeek(){const pk=$('#peek');if(!pk.classList.contains('on'))return;pk.classList.remove('on');document.querySelectorAll('.star.on').forEach(x=>x.classList.remove('on'));if(lastStar)lastStar.focus({preventScroll:true});}

/* stars: light on phones (fewer, smaller canvases), drawn once */
(function(){const mob=innerWidth<760,dpr=Math.min(devicePixelRatio||1,mob?1.5:2);
 const N=mob?[90,40,22]:[220,90,45];
 ['s1','s2','s3'].forEach((id,j)=>{const c=document.getElementById(id),w=innerWidth*1.1,h=innerHeight*1.1;c.width=w*dpr;c.height=h*dpr;const x=c.getContext('2d');x.scale(dpr,dpr);
  let seed=7+j*31;const r=()=>(seed=(seed*9301+49297)%233280)/233280;
  for(let i=0;i<N[j];i++){const px=r()*w,py=r()*h,s=j===0?r()*.9+.3:j===1?r()*1.1+.5:r()*1.4+.8,a=j===0?.35+r()*.4:.6+r()*.4;
   const col=r()<.18?'190,215,255':r()<.1?'255,220,235':'255,255,255';
   if(j>0){const g=x.createRadialGradient(px,py,0,px,py,s*4);g.addColorStop(0,'rgba('+col+','+(a*.35)+')');g.addColorStop(1,'rgba('+col+',0)');x.fillStyle=g;x.beginPath();x.arc(px,py,s*4,0,6.283);x.fill();}
   x.fillStyle='rgba('+col+','+a+')';x.beginPath();x.arc(px,py,s,0,6.283);x.fill();}});})();
</script>
</body>
</html>
