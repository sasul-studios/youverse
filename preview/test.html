<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Youverse - اكتشف ضوءك</title>
<link rel="icon" href="img/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Almarai:wght@400;700;800&family=Lora:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#03060e;color:#EAF4F6;font-family:Almarai,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;min-height:100dvh}
.bg{position:fixed;inset:0;z-index:0;background:#03060e url(v4d/cosmos-2x.webp) center/cover no-repeat;transform:scale(1.04);transition:filter 1.2s}
@media (max-aspect-ratio:1/1){.bg{background-image:url(v4/cosmos-2x.webp)}}
.bg:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 80% 70% at 50% 45%,rgba(3,6,14,.35),rgba(3,6,14,.82) 75%,rgba(3,6,14,.94))}
body.dark .bg{filter:brightness(.45) saturate(.8)}
body.lit .bg{filter:brightness(1) saturate(1.1)}
.top{position:relative;z-index:2;max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:18px 22px;gap:10px}
.top img{height:30px;display:block}
.top .r{display:flex;gap:8px;align-items:center}
.chip{color:rgba(234,244,246,.8);text-decoration:none;font-size:14px;font-weight:700;padding:8px 13px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);cursor:pointer;font-family:inherit}
.chip:hover{color:#fff;background:rgba(255,255,255,.12)}
main{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:14px 20px 70px;min-height:calc(100vh - 80px);min-height:calc(100dvh - 80px);display:flex;flex-direction:column;justify-content:center}
.screen{animation:in .55s cubic-bezier(.2,.7,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.c{text-align:center}
.serif{font-family:Amiri,serif}
[dir=ltr] .serif{font-family:Lora,serif}
h1{font-size:clamp(40px,7vw,64px);line-height:1.25;margin:0;font-weight:700;color:#fff;text-shadow:0 0 40px rgba(127,178,255,.25)}
.under{font-family:Amiri,serif;font-size:clamp(26px,4.4vw,38px);color:#9EEFF2;margin:8px 0 0;text-shadow:0 0 24px rgba(92,225,230,.5)}
.lead{font-size:clamp(16px,2.2vw,19px);line-height:1.9;color:rgba(234,244,246,.82);max-width:540px;margin:22px auto 0}
.orb{width:96px;height:96px;border-radius:50%;margin:0 auto 26px;background:radial-gradient(circle at 50% 45%,#fff 0%,var(--c,#9EEFF2) 22%,rgba(92,225,230,.0) 70%);box-shadow:0 0 60px var(--c,#5CE1E6),0 0 140px rgba(92,225,230,.25);animation:breathe 3.2s ease-in-out infinite;display:flex;align-items:center;justify-content:center;font-size:40px}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.08);opacity:1}}
.field{display:block;width:100%;max-width:420px;margin:30px auto 0;padding:17px 20px;border-radius:16px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:#fff;font:inherit;font-size:17px;text-align:center;outline:none;transition:border-color .2s,box-shadow .2s}
.field::placeholder{color:rgba(234,244,246,.5)}
.field:focus{border-color:#5CE1E6;box-shadow:0 0 0 4px rgba(92,225,230,.18)}
.field.bad{border-color:#FF8A8A;box-shadow:0 0 0 4px rgba(255,138,138,.15)}
.err{color:#FFB3B3;font-size:14px;margin:10px 0 0;min-height:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;margin-top:18px;padding:17px 40px;border-radius:40px;border:0;background:#5CE1E6;color:#032E36;font:inherit;font-weight:800;font-size:18px;cursor:pointer;text-decoration:none;position:relative;overflow:hidden;box-shadow:0 14px 40px rgba(92,225,230,.3);transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s,background .3s,opacity .3s}
.btn:disabled{opacity:.35;cursor:default;box-shadow:none}
.btn:before{content:"";position:absolute;top:0;bottom:0;width:45%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);transform:skewX(-20deg)}
@media (hover:hover) and (pointer:fine){.btn:not(:disabled):hover{transform:translateY(-3px) scale(1.05);background:#7AEAEE;box-shadow:0 0 0 6px rgba(92,225,230,.15),0 0 44px rgba(92,225,230,.7)}.btn:not(:disabled):hover:before{animation:sh 1s ease forwards}}
@keyframes sh{to{left:120%}}
.note{font-size:14px;color:rgba(234,244,246,.55);margin-top:14px}
/* question */
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;color:rgba(234,244,246,.7)}
.round{display:inline-block;font-size:13px;font-weight:800;letter-spacing:.3px;color:#9EEFF2;background:rgba(92,225,230,.1);border:1px solid rgba(92,225,230,.25);padding:6px 13px;border-radius:30px}
.bar{height:6px;border-radius:6px;background:rgba(255,255,255,.1);margin:14px 0 26px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#5CE1E6,#A99BFF);transition:width .5s cubic-bezier(.2,.7,.2,1)}
[dir=rtl] .bar i{background:linear-gradient(270deg,#5CE1E6,#A99BFF)}
h2{font-size:clamp(26px,4.4vw,36px);line-height:1.5;margin:0 0 22px;color:#fff;font-weight:700}
[dir=ltr] h2{line-height:1.3}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:start;padding:17px 18px;border-radius:18px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:#EAF4F6;font:inherit;font-size:17px;line-height:1.6;cursor:pointer;transition:border-color .2s,background .2s,transform .2s,box-shadow .2s}
.opt b{flex:none;width:34px;height:34px;border-radius:11px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:14px;color:#cfe;transition:background .2s,color .2s}
@media (hover:hover) and (pointer:fine){.opt:hover{border-color:rgba(92,225,230,.5);background:rgba(92,225,230,.08);transform:translateY(-2px)}}
.opt.on{border-color:#5CE1E6;background:rgba(92,225,230,.14);box-shadow:0 0 0 3px rgba(92,225,230,.15),0 0 30px rgba(92,225,230,.18)}
.opt.on b{background:#5CE1E6;color:#032E36}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:24px;gap:12px}
.link{background:none;border:0;color:#9EEFF2;font:inherit;font-weight:700;font-size:16px;cursor:pointer;padding:10px 4px}
.nav .btn{margin:0}
.quote{font-size:clamp(28px,5vw,44px);line-height:1.6;color:#fff;margin:0 auto;max-width:560px;text-shadow:0 0 30px rgba(169,155,255,.35)}
[dir=ltr] .quote{font-style:italic;line-height:1.35}
/* loading */
.msgs{height:32px;margin-top:14px;font-size:17px;color:#9EEFF2}
.msgs span{display:inline-block;animation:in .5s both}
/* result */
.hello{font-size:18px;color:rgba(234,244,246,.75);margin:0 0 14px}
[dir=rtl] .title{line-height:1.35}
.title{font-size:clamp(46px,8vw,76px);line-height:1.15;margin:0;color:#fff;text-shadow:0 0 50px var(--c)}
.tag{font-size:clamp(20px,3vw,26px);color:var(--c);margin:12px 0 0}
.desc{font-size:17px;line-height:2;color:rgba(234,244,246,.85);margin:20px auto 0;max-width:580px}
[dir=ltr] .desc{line-height:1.75}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:30px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.card{background:rgba(13,24,38,.62);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.1);border-radius:22px;padding:20px 22px;text-align:start}
.card h3{margin:0 0 8px;font-size:14px;font-weight:800;color:var(--c);display:flex;align-items:center;gap:8px;letter-spacing:.2px}
.card p{margin:0;font-size:17px;line-height:1.8;color:#fff}
.sec{margin-top:14px}
.world{border-color:color-mix(in srgb,var(--c) 45%,transparent);background:linear-gradient(135deg,color-mix(in srgb,var(--c) 18%,rgba(13,24,38,.7)),rgba(13,24,38,.62))}
.world .wn{font-size:clamp(26px,4vw,32px);color:#fff;margin:2px 0 6px}
.world .btn{margin-top:16px;padding:14px 30px;font-size:16px;background:var(--c)}
.soon{margin-top:12px;font-size:15px;line-height:1.8;color:rgba(234,244,246,.85);background:rgba(255,255,255,.06);border-radius:14px;padding:12px 14px}
.mlist{display:flex;flex-direction:column;gap:10px}
.mi{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);font-size:16px;color:#fff}
.mi i{font-style:normal;flex:none;width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--c) 22%,transparent)}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.day{padding:14px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}
.day small{display:block;font-size:12px;font-weight:800;color:var(--c);margin-bottom:6px}
.day span{font-size:15px;line-height:1.7;color:#fff}
.draft{font-size:12px;font-weight:700;color:#FFD98A;background:rgba(255,217,138,.12);padding:3px 9px;border-radius:20px}
.sent{display:flex;gap:12px;align-items:flex-start;font-size:16px;line-height:1.8}
.sharebox{margin-top:10px;padding:14px;border-radius:14px;background:rgba(255,255,255,.06);font-size:15px;line-height:1.8;color:rgba(234,244,246,.9)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btn2{flex:1;min-width:120px;padding:13px 18px;border-radius:14px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;font:inherit;font-weight:800;font-size:15px;cursor:pointer;transition:background .2s,transform .2s}
.btn2:hover{background:rgba(255,255,255,.16);transform:translateY(-2px)}
.btn2.main{background:var(--c);color:#032E36;border-color:transparent}
.sample{margin-top:26px;font-size:12px;color:rgba(234,244,246,.45);text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="dark">
<div class="bg"></div>
<header class="top">
  <a href="app.html#home" aria-label="Youverse"><img src="img/logo-light.png" alt="Youverse"></a>
  <div class="r"><button class="chip" id="lang" type="button">EN</button><a class="chip" id="exit" href="app.html#home"></a></div>
</header>
<main id="app"></main>
<script src="test-data.js"></script>
<script>
const D=window.YV_TEST,$=s=>document.querySelector(s),app=$('#app');
const KEYS={ar:['أ','ب','ج','د'],en:['A','B','C','D']};
let lang=new URLSearchParams(location.search).get('lang')==='en'?'en':'ar';
const S={screen:'welcome',q:0,ans:Array(10).fill(null),name:'',email:'',light:null,worldOpen:false};
const T=()=>D[lang],esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function setLang(l){lang=l;const t=T();document.documentElement.lang=l;document.documentElement.dir=t.dir;
 document.title=l==='en'?'Youverse - Discover Your Universe!':'Youverse - اكتشف عالمك!‏';
 $('#lang').textContent=l==='en'?'عربي':'EN';$('#exit').textContent=t.close;$('#exit').href='app.html#'+(l==='en'?'en':'home');
 history.replaceState(null,'',l==='en'?'?lang=en':location.pathname);render(false);}
$('#lang').onclick=()=>setLang(lang==='en'?'ar':'en');
function go(screen,extra){Object.assign(S,{screen},extra||{});render(true);}
function score(){const n={H:0,F:0,O:0,S:0,C:0};let last=null;
 S.ans.forEach((a,i)=>{if(a==null)return;const l=D.SCORE[i][a];n[l]++;last=l;});
 const top=Math.max(...Object.values(n)),tied=Object.keys(n).filter(k=>n[k]===top);
 if(tied.length===1)return tied[0];
 for(let i=9;i>=0;i--){const l=S.ans[i]!=null&&D.SCORE[i][S.ans[i]];if(tied.includes(l))return l;}   /* temporary tie-break: the latest answer wins */
 return tied[0];}
function render(anim){const t=T();let h='';document.body.className=S.screen==='result'?'lit':'dark';
 if(S.screen==='welcome'){
  h=`<section class="screen c"><div class="orb"></div><h1 class="serif">${esc(t.headline)}</h1><p class="under">${esc(t.underline)}</p>
  <p class="lead">${esc(t.intro)}</p>
  <input class="field" id="name" maxlength="30" autocomplete="given-name" placeholder="${esc(t.nameField)}" value="${esc(S.name)}">
  <div><button class="btn" id="start" type="button">${esc(t.start)}</button></div><p class="note">${esc(t.startNote)}</p></section>`;}
 else if(S.screen==='q'){const i=S.q,[qt,opts]=t.questions[i],r=i<3?0:i<6?1:2;
  h=`<section class="screen"><div class="meta"><span class="round">${esc(t.rounds[r])}</span><span>${esc(t.qOf(i+1))}</span></div>
  <div class="bar"><i style="width:${(i+1)*10}%"></i></div><h2 class="serif">${esc(qt)}</h2>
  <div class="opts">${opts.map((o,k)=>`<button type="button" class="opt${S.ans[i]===k?' on':''}" data-k="${k}"><b>${KEYS[lang][k]}</b><span>${esc(o)}</span></button>`).join('')}</div>
  <div class="nav"><button class="link" id="back" type="button" ${i===0?'style="visibility:hidden"':''}>${lang==='ar'?'→':'←'} ${esc(t.back)}</button>
  <button class="btn" id="next" type="button" ${S.ans[i]==null?'disabled':''}>${esc(t.cont)}</button></div></section>`;}
 else if(S.screen==='note'){h=`<section class="screen c"><div class="orb" style="--c:#A99BFF;width:70px;height:70px"></div>
  <p class="quote serif">${esc(t.notes[S.q])}</p><button class="btn" id="next" type="button" style="margin-top:34px">${esc(t.cont)}</button></section>`;}
 else if(S.screen==='loading'){h=`<section class="screen c"><div class="orb"></div><h2 class="serif" style="margin:0">${esc(t.loadingTitle)}</h2><div class="msgs" id="msgs"></div></section>`;}
 else if(S.screen==='email'){const L=t.lights[S.light],c=D.COLORS[S.light];
  h=`<section class="screen c" style="--c:${c}"><div class="orb" style="--c:${c}">${L.emoji}</div><h1 class="serif">${esc(t.lightTitle(L.name))}</h1>
  <p class="tag serif" style="color:${c}">${esc(L.tagline)}</p><p class="lead">${esc(t.emailText)}</p>
  <input class="field" id="email" type="email" inputmode="email" autocomplete="email" dir="ltr" placeholder="${esc(t.emailField)}" value="${esc(S.email)}">
  <p class="err" id="err"></p><button class="btn" id="reveal" type="button" style="margin-top:4px">${esc(t.emailBtn)}</button><p class="note">${esc(t.emailNote)}</p></section>`;}
 else if(S.screen==='result'){const L=t.lights[S.light],c=D.COLORS[S.light],name=S.name.trim()||t.you,share=t.shareText(L.name,L.tagline);
  h=`<section class="screen" style="--c:${c}"><div class="c"><div class="orb" style="--c:${c}">${L.emoji}</div>
  <p class="hello">${esc(t.greeting(name))}</p><h1 class="title serif">${esc(t.lightTitle(L.name))}</h1>
  <p class="tag serif">${esc(L.tagline)}</p><p class="desc">${esc(L.desc)}</p></div>
  <div class="grid2"><div class="card"><h3>⚡ ${esc(t.sections.superpower)}</h3><p>${esc(L.superpower)}</p></div>
  <div class="card"><h3>🌑 ${esc(t.sections.shadow)}</h3><p>${esc(L.shadow)}</p></div></div>
  <div class="card world sec"><h3>🌍 ${esc(t.sections.world)}</h3><div class="wn serif">${esc(L.world)}</div><p style="color:rgba(234,244,246,.85)">${esc(L.worldDesc)}</p>
   <button class="btn" id="enter" type="button">${esc(t.enterWorld(L.world))}</button>${S.worldOpen?`<div class="soon">${esc(t.worldSoon)}<br><a href="#" id="peek" style="color:var(--c);font-weight:800">${lang==='ar'?'معاينة: شاهد عالمك في YouFinder ←':'Preview: see your World in YouFinder →'}</a></div>`:''}</div>
  <div class="card sec"><h3>🎓 ${esc(t.sections.matches)}</h3><div class="mlist">${L.matches.map(m=>`<div class="mi"><i>▶</i><span>${esc(m)}</span></div>`).join('')}</div></div>
  <div class="card sec"><h3 style="justify-content:space-between"><span>🗓️ ${esc(t.sections.days)}</span><span class="draft">${lang==='ar'?'مسودة':'Draft'}</span></h3>
   <div class="days">${L.days.map((d,k)=>`<div class="day"><small>${esc(t.dayLabel(k+1))}</small><span>${esc(d)}</span></div>`).join('')}</div></div>
  <div class="card sec sent"><span style="font-size:22px">✉️</span><span>${esc(t.planSent(S.email))}</span></div>
  <div class="card sec"><h3>✨ ${esc(t.shareTitle)}</h3><div class="sharebox" id="stext">${esc(share)}</div>
   <div class="row"><button class="btn2 main" id="copy" type="button">${esc(t.copy)}</button><button class="btn2" id="share" type="button">${esc(t.share)}</button></div></div>
  <div class="c"><button class="link" id="retake" type="button" style="margin-top:18px">↻ ${esc(t.retake)}</button></div>
  <p class="sample">${esc(t.sampleNote)}</p></section>`;}
 app.innerHTML=h;if(!anim)app.querySelectorAll('.screen').forEach(e=>e.style.animation='none');
 if(anim)scrollTo({top:0,behavior:'instant'});bind();}
function bind(){const t=T(),on=(id,f)=>{const e=$(id);if(e)e.onclick=f;};
 if(S.screen==='welcome'){const n=$('#name');n.oninput=()=>S.name=n.value;n.onkeydown=e=>{if(e.key==='Enter')$('#start').click();};on('#start',()=>go('q',{q:0}));}
 if(S.screen==='q'){app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{S.ans[S.q]=+b.dataset.k;app.querySelectorAll('.opt').forEach(x=>x.classList.toggle('on',x===b));$('#next').disabled=false;});
  on('#back',()=>{if(S.q===0)return;go('q',{q:S.q-1});});
  on('#next',()=>{if(S.ans[S.q]==null)return;const n=S.q+1;if(n===10){S.light=score();go('loading');return;}
   if(t.notes[n])go('note',{q:n});else go('q',{q:n});});}
 if(S.screen==='note')on('#next',()=>go('q',{q:S.q}));
 if(S.screen==='loading'){const box=$('#msgs');let k=0;const tick=()=>{if(S.screen!=='loading')return;
   if(k<t.loading.length){box.innerHTML=`<span>${esc(T().loading[k])}</span>`;k++;setTimeout(tick,1100);}else go('email');};tick();}
 if(S.screen==='email'){const e=$('#email'),err=$('#err');e.oninput=()=>{S.email=e.value;e.classList.remove('bad');err.textContent='';};
  e.onkeydown=ev=>{if(ev.key==='Enter')$('#reveal').click();};
  on('#reveal',()=>{const v=e.value.trim();if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)){e.classList.add('bad');err.textContent=t.emailError;e.focus();return;}S.email=v;go('result');});}
 if(S.screen==='result'){const txt=$('#stext').textContent;
  on('#enter',()=>{S.worldOpen=true;render(false);});
  on('#peek',e=>{e.preventDefault();try{sessionStorage.setItem('yvWorld',S.light);}catch(x){}location.href='app.html#youfinder'+(lang==='en'?'-en':'');});
  on('#copy',async()=>{const b=$('#copy');try{await navigator.clipboard.writeText(txt);b.textContent=T().copied;}catch(e){b.textContent=T().copyFailed;}setTimeout(()=>{if($('#copy'))$('#copy').textContent=T().copy;},1800);});
  on('#share',async()=>{if(navigator.share){try{await navigator.share({text:txt});}catch(e){}}else $('#copy').click();});
  on('#retake',()=>{Object.assign(S,{ans:Array(10).fill(null),light:null,worldOpen:false});go('welcome');});}}
setLang(lang);
</script>
</body>
</html>
