<!DOCTYPE html>
<html lang="ar" dir="rtl" data-header="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Youverse - اكتشف عالمك!‏</title>
<link rel="icon" href="img/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Almarai:wght@400;700;800&family=Lora:wght@500;600;700&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#F9FAFD}img{max-width:100%}*{box-sizing:border-box}#measure{position:absolute;left:-20000px;top:0;width:1440px;visibility:hidden;display:none}</style>
<style>
/* v2 phone header */
.yv-h{position:sticky!important;top:0;z-index:60;background:rgba(255,255,255,.82)!important;-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%)}
.yv-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;position:relative}
.yv-bar{display:flex;align-items:center;gap:8px}
.yv-lang{font-family:'Lora','Almarai',serif;font-weight:700;font-size:14px;color:#127F87;border:1px solid #D5E6E9;border-radius:12px;padding:0 12px;height:40px;display:flex;align-items:center;background:#fff;text-decoration:none}
.yv-burger{width:42px;height:40px;border-radius:12px;border:0;background:#032E36;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0;cursor:pointer}
.yv-burger i{display:block;width:17px;height:2px;border-radius:2px;background:#fff;transition:transform .25s,opacity .2s}
html.yv-menu .yv-burger i:nth-child(1){transform:translateY(6px) rotate(45deg)}
html.yv-menu .yv-burger i:nth-child(2){opacity:0}
html.yv-menu .yv-burger i:nth-child(3){transform:translateY(-6px) rotate(-45deg)}
.yv-drawer{position:absolute;top:calc(100% + 8px);left:12px;right:12px;background:#fff;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid #E3EEF0;border-radius:22px;box-shadow:0 28px 60px -24px rgba(3,46,54,.38);padding:8px;opacity:0;transform:translateY(-8px) scale(.98);transform-origin:top center;pointer-events:none;transition:opacity .22s,transform .22s}
html.yv-menu .yv-drawer{opacity:1;transform:none;pointer-events:auto}
.yv-drawer nav{display:flex;flex-direction:column;gap:2px}
.yv-drawer nav a{display:block;padding:14px 16px;border-radius:14px;font-size:17px;font-weight:700;color:#2E4A50;text-decoration:none}
.yv-drawer nav a.on{background:#E8F7F8;color:#032E36}
.yv-acts{display:flex;gap:8px;padding:8px 4px 4px;border-top:1px solid #EDF3F4;margin-top:6px}
.yv-acts a{flex:1;text-align:center;padding:13px 10px;border-radius:14px;font-weight:700;font-size:15px;text-decoration:none}
.yv-acts .yv-main{background:#127F87;color:#fff}
.yv-acts .yv-sec{border:1px solid #CFE3E6;color:#127F87;background:#fff}
/* dark header */
.yvd{background:#0A1B22!important;border-bottom:1px solid rgba(255,255,255,.07)!important;position:sticky!important;top:0;z-index:60}
.yvd-row{max-width:1240px;margin:0 auto;padding:10px 32px;display:flex;align-items:center;gap:30px}
.yvd nav{display:flex;align-items:center;gap:4px;flex:1}
.yvd nav a{display:flex;align-items:center;gap:7px;color:rgba(232,244,246,.68);font-size:14px;font-weight:700;padding:8px 12px;border-radius:10px;text-decoration:none;transition:color .15s,background .15s}
.yvd nav a:hover{color:#fff;background:rgba(255,255,255,.06)}
.yvd nav a.on{color:#fff;background:rgba(92,225,230,.12)}
.yvd nav a.on svg{color:#5CE1E6}
.yvd-acts{display:flex;align-items:center;gap:10px}
.yvd-acts a{text-decoration:none;font-size:14px;font-weight:700}
.yvd-lang{display:flex;align-items:center;gap:6px;color:rgba(232,244,246,.75);padding:7px 10px;border-radius:10px;font-family:'Lora','Almarai',serif}
.yvd-lang:hover{background:rgba(255,255,255,.06);color:#fff}
.yvd-sec{color:rgba(232,244,246,.85);padding:8px 12px;border-radius:10px;transition:background .15s,color .15s}
.yvd .yvd-sec:hover,.yvd .yvd-lang:hover,.yvd nav a:hover,.yvd nav a.on{color:#fff!important}   /* the site-wide link hover is dark: keep header links light */
.yvd .yvd-sec:hover{background:rgba(255,255,255,.08)}
.yvd .yvd-main:hover{color:#032E36!important}
.yvd-main{background:#5CE1E6;color:#032E36!important;padding:9px 18px;border-radius:12px;text-decoration:none;font-weight:800;font-size:14px}
/* phone header on dark */
.yvd.yv-h{background:rgba(10,27,34,.92)!important}
.yvd .yv-lang{background:transparent;color:#E8F4F6;border-color:rgba(255,255,255,.18)}
.yvd .yv-burger{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14)}
.yvd .yv-drawer nav{flex-direction:column;align-items:stretch;gap:2px}
.yvd .yv-drawer nav a{justify-content:flex-start;display:flex;align-items:center;gap:10px;color:#2E4A50;font-size:17px;padding:14px 16px;border-radius:14px}
.yvd .yv-drawer nav a svg{width:18px;height:18px;color:#127F87}
.yvd .yv-drawer nav a.on{background:#E8F7F8;color:#032E36}
/* laptop hover: buttons and pills lift and grow a little so visitors notice them */
@media (hover:hover) and (pointer:fine){
#root a[style*="padding"],#root button{transition:transform .22s cubic-bezier(.2,.7,.2,1),box-shadow .22s,filter .22s}
#root a[style*="padding"]:hover,#root button:hover{transform:translateY(-3px) scale(1.05);box-shadow:0 14px 28px -12px rgba(3,46,54,.35);filter:brightness(1.04)}
#root a[style*="padding"]:active,#root button:active{transform:translateY(0) scale(.98)}
.yvd-main,.yvd-lang,.yvd-sec{transition:transform .2s,filter .2s}
.yvd-main:hover{transform:scale(1.06);filter:brightness(1.08)}
.yvd nav a:hover svg{transform:scale(1.15);transition:transform .2s}
}
/* phone: masterclass detail chips keep their compact size (two neat rows) */
@media (max-width:699px){
#root div[style*="max-width: 470px"]{font-size:15px!important;gap:10px!important}
#root span[style*="padding: 12px 18px; border-radius: 16px"]{padding:9px 14px!important;border-radius:14px!important}
#root span[style*="padding: 12px 18px; border-radius: 16px"]>span{font-size:17px!important}
}
/* TEST: light frosted-glass header (compare with app.html) */
html[data-header=light] .yvd{background:rgba(255,255,255,.62)!important;-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid rgba(3,46,54,.08)!important;box-shadow:0 8px 30px -18px rgba(3,46,54,.25)}
html[data-header=light] .yvd nav a{color:#4E6A70}
html[data-header=light] .yvd nav a:hover,html[data-header=light] .yvd nav a.on{color:#032E36!important;background:rgba(92,225,230,.18)}
html[data-header=light] .yvd nav a.on svg{color:#127F87}
html[data-header=light] .yvd .yvd-sec{color:#2E4A50}
html[data-header=light] .yvd .yvd-sec:hover,html[data-header=light] .yvd .yvd-lang:hover{color:#032E36!important;background:rgba(3,46,54,.05)}
html[data-header=light] .yvd .yvd-lang{color:#4E6A70}
html[data-header=light] .yvd .yvd-main{background:#127F87;color:#fff!important}
html[data-header=light] .yvd .yvd-main:hover{color:#fff!important}
html[data-header=light] .yvd.yv-h{background:rgba(255,255,255,.7)!important}
html[data-header=light] .yvd .yv-lang{color:#127F87;border-color:#D5E6E9;background:rgba(255,255,255,.7)}
html[data-header=light] .yvd .yv-burger{background:#032E36;border:0}
/* pages were drawn at a fixed artboard height: let them end at their footer (no empty band under it) */
#root > div{min-height:100vh!important;height:auto!important}
</style>
</head>
<body>
<div id="root"></div>
<div id="measure" aria-hidden="true"></div>
<script src="pages.js"></script>
<script src="enhance.js"></script>
<script src="app.js"></script>
</body>
</html>
