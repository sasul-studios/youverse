<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Youverse - لوحة التحكم</title>
<link rel="icon" href="img/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Almarai:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#032E36;--ink2:#2E4A50;--mut:#6B8389;--line:#E3EEF0;--bg:#F4F8FA;--card:#fff;--teal:#127F87;--cyan:#5CE1E6;--lav:#D9D5F5;--pink:#F3D7E2;--ok:#1E9E6A;--warn:#C98A12;--bad:#D0465A}
*{box-sizing:border-box}html,body{margin:0}body{font-family:Almarai,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:Amiri,serif;margin:0;line-height:1.3}
.hide{display:none!important}

/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#04070f url(v5d/cosmos-2x.webp) center/cover}
#login:before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse 70% 60% at 50% 45%,rgba(3,6,14,.35),rgba(3,6,14,.85))}
.lg{position:relative;width:100%;max-width:400px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border-radius:26px;padding:34px 30px;color:#fff;box-shadow:0 30px 80px -30px rgba(0,0,0,.7)}
.lg img{height:34px;display:block;margin:0 auto 18px}
.lg h1{text-align:center;font-size:30px;margin-bottom:4px}.lg p{text-align:center;color:rgba(255,255,255,.7);margin:0 0 24px;font-size:14px}
.lg label{display:block;font-size:13px;color:rgba(255,255,255,.75);margin:14px 0 6px}
.lg input{width:100%;height:48px;border-radius:14px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;padding:0 14px;outline:none}
.lg input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(92,225,230,.2)}
.lg button{width:100%;height:50px;margin-top:22px;border:0;border-radius:14px;background:var(--cyan);color:var(--ink);font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 12px 30px -10px rgba(92,225,230,.6)}
.lg .note{margin-top:16px;font-size:12px;color:rgba(255,255,255,.55);text-align:center;line-height:1.7}
.lg .fg{display:block;text-align:start;margin-top:10px;font-size:13px;color:var(--cyan);cursor:pointer;background:none;border:0;width:auto;height:auto;padding:0;box-shadow:none;font-weight:700}
.lg .ok{color:#9BF0C9;font-size:13.5px;text-align:center;line-height:1.8;margin-top:12px}
.lg .back{display:block;margin:14px auto 0;background:none;border:0;color:rgba(255,255,255,.7);font-size:13px;cursor:pointer;width:auto;height:auto;box-shadow:none;padding:0}
.lg .err{color:#FF9BAA;font-size:13px;margin-top:10px;text-align:center;min-height:18px}

/* shell */
#app{display:flex;min-height:100vh}
aside{width:250px;flex-shrink:0;background:#0A1B22;color:#E8F4F6;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;z-index:40}
aside .brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
aside .brand img{height:26px}aside .brand span{font-size:12px;color:rgba(232,244,246,.55);border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:3px 9px}
aside nav a{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:12px;color:rgba(232,244,246,.7);font-weight:700;font-size:14.5px;cursor:pointer;transition:background .15s,color .15s}
aside nav a svg{width:19px;height:19px;flex-shrink:0}
aside nav a:hover{background:rgba(255,255,255,.06);color:#fff}
aside nav a.on{background:rgba(92,225,230,.13);color:#fff}aside nav a.on svg{color:var(--cyan)}
aside nav a b{margin-inline-start:auto;background:var(--cyan);color:var(--ink);font-size:11px;border-radius:20px;padding:2px 7px}
aside .me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px;border-top:1px solid rgba(255,255,255,.08)}
.av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--ink);background:linear-gradient(135deg,var(--cyan),var(--lav));flex-shrink:0}
aside .me div{font-size:13px;line-height:1.5}aside .me small{color:rgba(232,244,246,.5)}
aside .me button{margin-inline-start:auto;background:none;border:0;color:rgba(232,244,246,.6);cursor:pointer;padding:6px}
main{flex:1;min-width:0;padding:26px 34px 60px}
.top{display:flex;align-items:center;gap:14px;margin-bottom:24px;flex-wrap:wrap}
.top h1{font-size:34px}.top .sub{color:var(--mut);font-size:14px;margin-top:2px}
.top .r{margin-inline-start:auto;display:flex;gap:10px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:30px;padding:7px 13px;font-size:13px;color:var(--ink2);font-weight:700}
.demo{background:#FFF6E3;border-color:#F2DDAA;color:#8A5D00}
.burger{display:none;width:42px;height:42px;border-radius:12px;border:0;background:var(--ink);color:#fff;cursor:pointer}

.btn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 18px;border-radius:12px;border:0;background:var(--teal);color:#fff;font-weight:800;cursor:pointer;font-size:14px;transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px}

.grid{display:grid;gap:18px}
.kpis{grid-template-columns:repeat(4,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 22px;box-shadow:0 10px 30px -24px rgba(3,46,54,.35)}
.kpi .l{color:var(--mut);font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.kpi .l i{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:16px}
.kpi .v{font-size:32px;font-weight:800;margin:12px 0 4px;letter-spacing:-.5px}
.kpi .d{font-size:12.5px;font-weight:700}.up{color:var(--ok)}.dn{color:var(--bad)}
.two{grid-template-columns:1.6fr 1fr;margin-top:18px}
.card h3{font-size:22px;margin-bottom:4px}.card .hint{color:var(--mut);font-size:13px;margin-bottom:16px}
.ch{width:100%;height:220px;display:block}
.bars{display:flex;flex-direction:column;gap:13px}
.bar .t{display:flex;justify-content:space-between;font-size:14px;font-weight:700;margin-bottom:6px}.bar .t span{color:var(--mut);font-weight:400}
.bar .b{height:10px;border-radius:10px;background:#EEF4F5;overflow:hidden}.bar .b i{display:block;height:100%;border-radius:10px}
.list{display:flex;flex-direction:column}
.list .it{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #F0F5F6;font-size:14px}.list .it:last-child{border:0}
.list .it small{color:var(--mut);display:block;font-size:12.5px}.list .it .when{margin-inline-start:auto;color:var(--mut);font-size:12px;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}

/* tables */
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.tools input,.tools select{height:42px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:#fff;outline:none;min-width:0}
.tools input{flex:1 1 240px}.tools input:focus,.tools select:focus{border-color:var(--teal)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:720px}
th{text-align:start;color:var(--mut);font-weight:700;font-size:12.5px;padding:0 12px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:13px 12px;border-bottom:1px solid #F0F5F6;vertical-align:middle}
tbody tr{cursor:pointer;transition:background .12s}tbody tr:hover{background:#F6FBFC}
.u{display:flex;align-items:center;gap:10px}.u small{display:block;color:var(--mut);font-size:12px}
.lt{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:4px 10px;font-size:12.5px;font-weight:700;white-space:nowrap}
.st{display:inline-block;border-radius:20px;padding:4px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.st.ok{background:#E3F6EE;color:var(--ok)}.st.warn{background:#FFF3DA;color:var(--warn)}.st.bad{background:#FDE7EA;color:var(--bad)}.st.mute{background:#EEF3F4;color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:30px}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:var(--mut);font-size:13px}

/* masterclasses */
.mcs{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.mc{padding:0;overflow:hidden;display:flex;flex-direction:column}
.mc .cv{height:120px;position:relative;display:flex;align-items:flex-end;padding:14px 16px;color:#fff}
.mc .cv .st{position:absolute;top:12px;inset-inline-start:12px}
.mc .cv h4{margin:0;font-family:Amiri,serif;font-size:21px;line-height:1.3;text-shadow:0 2px 12px rgba(0,0,0,.4)}
.mc .bd{padding:14px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.mc .meta{display:flex;flex-wrap:wrap;gap:6px}.mc .meta span{background:#F2F7F8;border-radius:20px;padding:4px 9px;font-size:12px;color:var(--ink2)}
.mc .row{display:flex;justify-content:space-between;align-items:center;margin-top:auto;font-size:13px;color:var(--mut)}.mc .row b{color:var(--ink);font-size:15px}

/* drawer + modal */
.ov{position:fixed;inset:0;background:rgba(3,20,26,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:80}
.ov.on{opacity:1;pointer-events:auto}
.dr{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(440px,100%);background:#fff;z-index:90;transform:translateX(-105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding:24px;overflow-y:auto;box-shadow:0 0 60px rgba(0,0,0,.2)}
html[dir=rtl] .dr{transform:translateX(-105%)}.dr.on{transform:none!important}
.dr .x,.md .x{position:absolute;top:16px;inset-inline-start:16px;width:36px;height:36px;border-radius:50%;border:0;background:#F0F5F6;cursor:pointer;font-size:18px}
.dr .hd{display:flex;align-items:center;gap:14px;margin:34px 0 20px}.dr .hd .av{width:54px;height:54px;font-size:20px}
.dr .hd h2{font-size:26px}.dr .hd small{color:var(--mut)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;font-size:14px;margin:0 0 18px}.kv dt{color:var(--mut)}.kv dd{margin:0;font-weight:700}
.sec{font-family:Amiri,serif;font-size:19px;margin:20px 0 10px}
.prog{height:8px;border-radius:8px;background:#EEF4F5;overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--cyan))}
.md{position:fixed;top:50%;left:50%;transform:translate(-50%,-46%);opacity:0;pointer-events:none;width:min(560px,calc(100% - 28px));max-height:calc(100vh - 40px);overflow-y:auto;background:#fff;border-radius:22px;padding:26px;z-index:90;transition:opacity .2s,transform .2s}
.md.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.md h2{font-size:26px;margin-bottom:16px}
.fm{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fm .w{grid-column:1/-1}
.fm label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mut);font-weight:700}
.fm input,.fm select,.fm textarea{height:44px;border:1px solid var(--line);border-radius:12px;padding:0 12px;outline:none;color:var(--ink);font-weight:400}
.fm textarea{height:84px;padding:10px 12px;resize:vertical}
.fm input:focus,.fm select:focus,.fm textarea:focus{border-color:var(--teal)}
.md .act{display:flex;gap:10px;margin-top:20px;justify-content:flex-start}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:14px;font-weight:700;opacity:0;transition:.25s;z-index:100;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* settings */
.set{grid-template-columns:1fr 1fr}
.sw{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid #F0F5F6}.sw:last-child{border:0}
.sw small{display:block;color:var(--mut);font-size:12.5px;margin-top:3px}
.tg{width:46px;height:26px;border-radius:26px;background:#D5E2E5;position:relative;cursor:pointer;border:0;flex-shrink:0;transition:background .2s}
.tg:after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:right .2s;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.tg.on{background:var(--teal)}.tg.on:after{right:23px}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.two,.set{grid-template-columns:1fr}}
@media (max-width:820px){
 aside{position:fixed;inset-inline-start:0;transform:translateX(110%);transition:transform .25s;box-shadow:0 0 50px rgba(0,0,0,.4)}
 aside.on{transform:none}
 .burger{display:flex;align-items:center;justify-content:center}
 main{padding:16px 16px 50px}.top h1{font-size:27px}.top .r{margin-inline-start:0;width:100%}
 .kpi .v{font-size:25px}.card{padding:16px;border-radius:18px}.fm{grid-template-columns:1fr}
}
@media (max-width:440px){.kpis{gap:10px}.kpi .l i{display:none}}
</style>
</head>

<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>n.toLocaleString('en-US'),qar=n=>fmt(n)+' ر.ق';

/* ---------- data: live from Supabase, or sample data for a demo ---------- */
const SB=window.supabase.createClient('https://bhcvhdyutwanorlpesnu.supabase.co','sb_publishable_mKEqP1C7P-lnGcWQwaQM3w_cm1A1NXm');   /* publishable key: safe in the page, access is enforced by row-level security */
const LIGHTS={H:{n:'الأفق',e:YVI('H',15),w:'عالم المؤسسين',c:'#7FB2FF'},F:{n:'الصانع',e:YVI('F',15),w:'عالم الصنّاع',c:'#F2A93B'},O:{n:'المدار',e:YVI('O',15),w:'عالم التأثير',c:'#5CE1E6'},S:{n:'الشرارة',e:YVI('S',15),w:'عالم المبدعين',c:'#F08BB4'},C:{n:'البوصلة',e:YVI('C',15),w:'عالم الاكتشاف',c:'#A99BFF'}};
const now=Date.now(),DAY=864e5;
let DEMO=false,ME=null,USERS=[],PAYS=[],MC=[],RESULTS=[],SETTINGS={},MENTORS=[];
const DAYS=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
function loadSample(){DEMO=true;let seed=7;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280,pick=a=>a[Math.floor(rnd()*a.length)];
 const FN=['سارة','محمد','نورة','عبدالله','مريم','خالد','ريم','فهد','لولوة','حمد','جواهر','يوسف','هيا','علي','دانة','سلطان','شيخة','راشد','العنود','ناصر','أمل','تميم','ليان','جاسم','روضة','مبارك','غلا','عمر','نوف','سعود'];
 const LN=['الكواري','المري','السليطي','العطية','النعيمي','الهاجري','المهندي','الخليفي','البوعينين','الدوسري','الكبيسي','المناعي'];
 MC=[{id:1,t:'كيف تبدأ مشروعك الأول',m:'د. هند الأنصاري',w:'H',ch:6,min:45,p:149,st:'pub',en:214},{id:2,t:'صناعة المحتوى الذي يُلهم',m:'أ. فيصل الملا',w:'S',ch:8,min:60,p:179,st:'pub',en:301},
  {id:3,t:'التفكير الهندسي للمبتدئين',m:'م. عائشة الجابر',w:'F',ch:5,min:40,p:129,st:'pub',en:122},{id:4,t:'فن الإقناع والتأثير',m:'أ. ماجد الحمادي',w:'O',ch:7,min:55,p:169,st:'pub',en:187},
  {id:5,t:'اكتشف شغفك الحقيقي',m:'د. لمى الشهابي',w:'C',ch:6,min:50,p:0,st:'pub',en:356},{id:6,t:'القيادة في عمر مبكر',m:'أ. بدر السويدي',w:'H',ch:4,min:35,p:149,st:'draft',en:0}];
 USERS=[];for(let i=0;i<64;i++){const f=pick(FN),l=pick(LN),lt=rnd()<.12?null:pick(Object.keys(LIGHTS)),age=13+Math.floor(rnd()*14),j=Math.floor(rnd()*60);
  const plan=lt&&rnd()<.42?pick(['شهري','سنوي']):null;
  USERS.push({id:1000+i,n:f+' '+l,e:'user'+(1000+i)+'@mail.com',age,lt,joined:now-j*DAY-Math.floor(rnd()*DAY),plan,

  <div class="sw"><div><b>تنبيه عند طلب موافقة ولي أمر</b><small>لمن هم تحت 18</small></div><button class="tg ${SETTINGS.notify_consent_request?'on':''}" data-key="notify_consent_request"></button></div></div></div>`;

/* ---------- shell ---------- */
let cur='home';
function go(k){cur=k;const p=PAGES.find(x=>x.k===k);$('#pt').textContent=p.t;$('#ps').textContent=p.s;
 $('#nav').innerHTML=PAGES.map(x=>`<a data-k="${x.k}" class="${x.k===k?'on':''}">${x.i}${x.t}${x.k==='users'?`<b>${USERS.filter(u=>u.consent==='wait').length}</b>`:''}</a>`).join('');
 $('#view').innerHTML=V[k]();$('#side').classList.remove('on');scrollTo(0,0);
 if(k==='users'){uRows();$('#uq').oninput=e=>{uq=e.target.value.trim();uRows();};$('#ul').onchange=e=>{ul=e.target.value;uRows();};$('#us').onchange=e=>{us=e.target.value;uRows();};
  $('#ucsv').onclick=()=>csv('youverse-users.csv',[['الاسم','البريد','العمر','الضوء','الاشتراك','التسجيل'],...uFilter().map(u=>[u.n,u.e,u.age,u.lt?LIGHTS[u.lt].n:'',u.plan||'مجاني',date(u.joined)])]);}
 if(k==='test')$('#tcsv').onclick=()=>csv('youverse-light-results.csv',[['الاسم','البريد','الضوء','العالم'],...USERS.filter(u=>u.lt).map(u=>[u.n,u.e,LIGHTS[u.lt].n,LIGHTS[u.lt].w])]);
 if(k==='pay'){$('#pf').onchange=e=>{pf=e.target.value;go('pay');};$('#pcsv').onclick=()=>csv('youverse-payments.csv',[['رقم العملية','المستخدم','البند','المبلغ','الحالة','التاريخ'],...PAYS.map(p=>[p.id,p.u.n,p.what,p.amt,p.st,date(p.when)])]);}
 if(k==='mc'){$('#mcAdd').onclick=()=>mcForm(0);}
 if(k==='mentors'||k==='trainers'){$('#mtAdd').onclick=()=>mtForm(0);$('#mf').onchange=e=>{mf=e.target.value;go(KT().pg);};}
 history.replaceState(null,'','#'+k);}
$('#nav').onclick=e=>{const a=e.target.closest('a');if(a)go(a.dataset.k);};
$('#view').onclick=e=>{const ma=e.target.closest('[data-mt]');if(ma){const m=MENTORS.find(x=>String(x.id)===ma.dataset.id),a=ma.dataset.mt;
  if(a==='reject'&&!confirm('رفض طلب '+m.n+' وحذفه؟'))return;
  if(DEMO){if(a==='reject')MENTORS.splice(MENTORS.indexOf(m),1);else{m.ok=a==='approve';m.applied=false;}go(KT().pg);return toast(a==='approve'?'تم الاعتماد':a==='hide'?'تم الإخفاء':'تم الرفض');}
  const q=a==='reject'?SB.from('mentors').delete().eq('id',m.id):SB.from('mentors').update({approved:a==='approve'}).eq('id',m.id);
  return q.then(async({error})=>{if(error)return toast('تعذّر الحفظ: '+error.message);await refresh();go(KT().pg);toast(a==='approve'?'تم الاعتماد، ويظهر الحين في '+KT().w:a==='hide'?'تم الإخفاء':'تم الرفض');});}
 const mr=e.target.closest('tr[data-m]');if(mr)return mtForm(mr.dataset.m);
 const tr=e.target.closest('tr[data-u]');if(tr)return userDrawer(tr.dataset.u);
 const ed=e.target.closest('[data-e]');if(ed)return mcForm(ed.dataset.e);
 const pb=e.target.closest('[data-p]');if(pb){const m=MC.find(x=>String(x.id)===pb.dataset.p),ns=m.st==='pub'?'draft':'pub';
  if(DEMO){m.st=ns;go('mc');return toast(ns==='pub'?'تم النشر':'تم الإخفاء');}
  return SB.from('masterclasses').update({status:ns==='pub'?'published':'draft'}).eq('id',m.id).then(({error})=>{if(error)return toast('تعذّر الحفظ: '+error.message);m.st=ns;go('mc');toast(ns==='pub'?'تم النشر':'تم الإخفاء');});}
 const tg=e.target.closest('.tg');if(tg){const k=tg.dataset.key,on=!tg.classList.contains('on');tg.classList.toggle('on',on);
  if(!k||DEMO)return toast(k?'تم التغيير (بيانات تجريبية)':'يتفعّل لاحقاً');
  return SB.from('settings').update({value:on,updated_at:new Date().toISOString()}).eq('key',k).then(({error})=>{if(error){tg.classList.toggle('on',!on);return toast('تعذّر الحفظ: '+error.message);}SETTINGS[k]=on;toast('تم الحفظ');});}
 const t=e.target.closest('[data-t]');if(t)toast(t.dataset.t);};
function openDr(h){$('#drb').innerHTML=h;$('#dr').classList.add('on');$('#ov').classList.add('on');}
function openMd(h){$('#mdb').innerHTML=h;$('#md').classList.add('on');$('#ov').classList.add('on');}
function closeAll(){['#dr','#md','#ov'].forEach(s=>$(s).classList.remove('on'));}
document.addEventListener('click',e=>{if(e.target.closest('[data-close]')||e.target.id==='ov')closeAll();});
addEventListener('keydown',e=>{if(e.key==='Escape')closeAll();});
$('#burger').onclick=()=>$('#side').classList.toggle('on');
$('#today').textContent=new Date().toLocaleDateString('ar-QA',{weekday:'long',day:'numeric',month:'long'});

/* ---------- login: Supabase auth, admin role only ---------- */
const show=id=>['#lgf','#rsf','#npf'].forEach(x=>$(x).classList.toggle('hide',x!==id));
const back=location.origin+location.pathname;
async function refresh(){if(DEMO)return;await loadReal();}
async function enterReal(user){
 const {data:pr,error}=await SB.from('profiles').select('role,status,email').eq('id',user.id).single();
 if(error||!pr||pr.role!=='admin'||pr.status!=='active'){await SB.auth.signOut();show('#lgf');$('#lerr').textContent='هذا الحساب ليس حساب المدير.';return;}
 ME=user;try{await loadReal();}catch(e){$('#lerr').textContent='تعذّر تحميل البيانات: '+e.message;return;}
 $('#modeChip').textContent='متصل بقاعدة البيانات';$('#modeChip').classList.remove('demo');
 $('#meMail').textContent=user.email;$('#login').classList.add('hide');$('#app').classList.remove('hide');const h=location.hash.slice(1);go(PAGES.some(p=>p.k===h)?h:'home');}
function enterDemo(){loadSample();$('#modeChip').textContent='بيانات تجريبية';$('#modeChip').classList.add('demo');$('#meMail').textContent='demo@youverse.qa';
 $('#login').classList.add('hide');$('#app').classList.remove('hide');go('home');}
$('#lgf').onsubmit=async e=>{e.preventDefault();const btn=$('#lgf button[type=submit]');btn.disabled=true;$('#lerr').textContent='';
 const {data,error}=await SB.auth.signInWithPassword({email:$('#le').value.trim(),password:$('#lp').value});btn.disabled=false;
 if(error){$('#lerr').textContent=/Invalid login/i.test(error.message)?'البريد أو كلمة المرور غير صحيحة.':/fetch/i.test(error.message)?'تعذّر الاتصال. تأكد من الإنترنت وحاول مرة ثانية.':error.message;return;}enterReal(data.user);};
let firstMode=false;
$('#fgo').onclick=()=>{firstMode=false;$('#rsT').textContent='استعادة كلمة المرور';$('#rsP').textContent='اكتب بريد حساب المدير، ونرسل لك رابطاً لتعيين كلمة مرور جديدة';$('#rsB').textContent='إرسال رابط الاستعادة';show('#rsf');$('#re').value=$('#le').value;$('#rok').classList.add('hide');};
$('#first').onclick=()=>{firstMode=true;$('#rsT').textContent='أول دخول للمدير';$('#rsP').textContent='اكتب بريد المدير، ونرسل لك رابط دخول. بعدها تختار كلمة المرور.';$('#rsB').textContent='أرسل رابط الدخول';show('#rsf');$('#re').value=$('#le').value;$('#rok').classList.add('hide');};
$('#rback').onclick=()=>show('#lgf');
$('#demo').onclick=enterDemo;
$('#rsf').onsubmit=async e=>{e.preventDefault();const m=$('#re').value.trim(),btn=$('#rsB');btn.disabled=true;
 const {error}=firstMode?await SB.auth.signInWithOtp({email:m,options:{shouldCreateUser:true,emailRedirectTo:back}}):await SB.auth.resetPasswordForEmail(m,{redirectTo:back});btn.disabled=false;
 $('#rok').innerHTML=error?('<span style="color:#FF9BAA">'+esc(error.message)+'</span>'):(firstMode?'أرسلنا رابط الدخول إلى <b>'+esc(m)+'</b>. افتحه من نفس الجهاز، ثم اختر كلمة المرور.':'إذا كان <b>'+esc(m)+'</b> بريد حساب المدير، سيصلك رابط خلال دقائق.<br>افتحه واختر كلمة مرور جديدة.');$('#rok').classList.remove('hide');};
$('#npf').onsubmit=async e=>{e.preventDefault();const a=$('#np1').value,b=$('#np2').value;if(a!==b){$('#nperr').textContent='كلمتا المرور غير متطابقتين';return;}
 const {data,error}=await SB.auth.updateUser({password:a,data:{pw_set:true}});if(error){$('#nperr').textContent=error.message;return;}history.replaceState(null,'',location.pathname);enterReal(data.user);};
document.addEventListener('click',async e=>{if(e.target.id!=='pwSave')return;const f=$('#pwf');if(!f.reportValidity())return;const d=Object.fromEntries(new FormData(f));
 if(d.n!==d.c){$('#pwerr').textContent='كلمتا المرور غير متطابقتين';return;}if(d.n===d.o){$('#pwerr').textContent='اختر كلمة مرور مختلفة عن الحالية';return;}
 if(DEMO){$('#pwerr').textContent='';f.reset();return toast('تم تغيير كلمة المرور (بيانات تجريبية)');}
 const {error:e1}=await SB.auth.signInWithPassword({email:ME.email,password:d.o});if(e1){$('#pwerr').textContent='كلمة المرور الحالية غير صحيحة';return;}
 const {error}=await SB.auth.updateUser({password:d.n,data:{pw_set:true}});if(error){$('#pwerr').textContent=error.message;return;}$('#pwerr').textContent='';f.reset();toast('تم تغيير كلمة المرور');});
$('#out').onclick=async()=>{if(!DEMO)await SB.auth.signOut();location.hash='';location.reload();};
/* returning from an email link: password recovery, or the first magic-link sign-in */
SB.auth.onAuthStateChange((ev,session)=>{if(ev==='PASSWORD_RECOVERY'){show('#npf');return;}
 if(ev==='SIGNED_IN'&&session&&!session.user.user_metadata?.pw_set&&/access_token|code=/.test(location.href)){show('#npf');}});
SB.auth.getSession().then(({data})=>{const u=data.session&&data.session.user;if(!u)return;if(!u.user_metadata?.pw_set){show('#npf');return;}enterReal(u);});
</script>
