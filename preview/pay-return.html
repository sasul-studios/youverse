<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Youverse · الدفع</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Almarai:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Almarai,sans-serif;color:#0B2A33;background:linear-gradient(135deg,#E3F8F9,#EEEAFB 55%,#FBEAF1);padding:20px}
.box{background:rgba(255,255,255,.85);border-radius:28px;padding:36px 30px;max-width:440px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(11,42,51,.08)}
.ic{width:72px;height:72px;border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;background:#E8F7F8}
h1{font-family:Amiri,serif;font-size:30px;margin:0 0 8px}p{color:#5B7480;line-height:1.8;margin:0 0 6px}
.sum{margin:16px 0 22px;font-size:14.5px}
a.btn{display:inline-block;background:#127F87;color:#fff;text-decoration:none;padding:12px 26px;border-radius:24px}
.spin{width:34px;height:34px;border:3px solid #CFE3E6;border-top-color:#127F87;border-radius:50%;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box"><div class="ic" id="ic"><div class="spin"></div></div><h1 id="h">نتأكد من الدفع…</h1><p id="p">لحظات بس.</p><div class="sum" id="sum"></div><a class="btn" id="back" href="app.html">ارجع لـ Youverse</a></div>
<script>
const en=(navigator.language||'').startsWith('en')&&!/[?&]lang=ar/.test(location.search);
const T=en?{wait:'Checking your payment…',ok:'Payment received',okP:'Thank you. Your purchase is now active.',pend:'Payment is being processed',pendP:'We will update your account as soon as SkipCash confirms it.',bad:'Payment not completed',badP:'No money was taken. You can try again.',err:'We could not check the payment',errP:'If money was taken, it will be confirmed automatically. You can also contact us.',back:'Back to Youverse',q:'QAR'}
:{wait:'نتأكد من الدفع…',ok:'تم الدفع بنجاح',okP:'شكراً لك. مشترياتك صارت مفعّلة.',pend:'الدفع قيد المعالجة',pendP:'بنحدّث حسابك أول ما تأكّده SkipCash.',bad:'ما اكتمل الدفع',badP:'ما انخصم منك شيء، وتقدر تحاول مرة ثانية.',err:'ما قدرنا نتأكد من الدفع',errP:'إذا انخصم المبلغ بيتأكد تلقائياً، وتقدر تتواصل معنا.',back:'ارجع لـ Youverse',q:'ر.ق'};
if(en){document.documentElement.lang='en';document.documentElement.dir='ltr';}
const $=s=>document.getElementById(s);$('h').textContent=T.wait;$('back').textContent=T.back;
const id=new URLSearchParams(location.search).get('id');
const ICON={ok:'<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#17713A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',bad:'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#A3243A" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',pend:'<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#C98A12" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>'};
function show(k,j){$('ic').innerHTML=ICON[k==='err'?'pend':k];$('ic').style.background=k==='ok'?'#E3F6EA':k==='bad'?'#FDE7EA':'#FFF3DA';$('h').textContent=T[k];$('p').textContent=T[k+'P'];if(j&&j.amount)$('sum').textContent=(j.label||'')+' · '+j.amount+' '+T.q;}
let tries=0;
async function check(){
 if(!id)return show('err');
 try{const r=await fetch('/api/skipcash/status?id='+encodeURIComponent(id));const j=await r.json();if(!r.ok)throw 0;
  if(j.status==='paid')return show('ok',j);
  if(['failed','cancelled'].includes(j.status))return show('bad',j);
  if(++tries<6)return setTimeout(check,2500);show('pend',j);
 }catch(e){if(++tries<3)return setTimeout(check,2500);show('err');}
}
check();
</script>
</body>
</html>
