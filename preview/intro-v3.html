<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Youverse — ادخل عالمك</title>
<link rel="icon" href="img/1e4dffc431313b7bc68eadda79d3417c.png">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Almarai:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;background:#050b1a;font-family:Almarai,sans-serif}
#scene{height:300vh;position:relative}@media (max-aspect-ratio:1/1){#scene{height:220vh}}
.stick{position:sticky;top:0;height:100vh;height:100lvh;overflow:hidden;contain:strict}
#sv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#050b1a}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at 52% 55%,transparent 30%,rgba(3,8,20,.55) 100%);pointer-events:none}
.scrim{position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 50% 50%,rgba(2,6,18,.62) 0%,rgba(2,6,18,.38) 45%,rgba(2,6,18,0) 78%);opacity:0;pointer-events:none}
.line{position:absolute;left:0;right:0;text-align:center;color:#fff;font-family:Amiri,serif;font-weight:700;opacity:0;padding:0 24px;will-change:opacity,transform}
.hint{position:absolute;bottom:34px;left:0;right:0;text-align:center;color:rgba(255,255,255,.75);font-size:14px;letter-spacing:.5px}
.hint i{display:block;margin:10px auto 0;width:22px;height:36px;border:2px solid rgba(255,255,255,.6);border-radius:12px;position:relative}
.hint i:after{content:"";position:absolute;top:6px;left:50%;width:4px;height:8px;margin-left:-2px;border-radius:2px;background:#fff;animation:d 1.6s infinite}
@keyframes d{0%{opacity:0;transform:translateY(0)}40%{opacity:1}100%{opacity:0;transform:translateY(12px)}}
.load{position:absolute;bottom:52px;left:50%;width:150px;height:2px;margin-left:-75px;border-radius:2px;background:rgba(255,255,255,.14);overflow:hidden;display:none;transition:opacity .5s}
.load span{display:block;height:100%;width:0;background:linear-gradient(90deg,#5CE1E6,#D9D5F5);transition:width .2s}
.top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:flex-end;align-items:center;padding:22px 36px;z-index:5}
.skip{color:#fff;text-decoration:none;font-size:14px;border:1px solid rgba(255,255,255,.35);padding:9px 18px;border-radius:30px;background:rgba(10,20,40,.35)}
.hero{position:absolute;inset:0;opacity:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:90px 24px 60px}
.hero h1{font-family:Amiri,serif;font-size:clamp(40px,6vw,84px);color:#fff;margin:0 0 18px;line-height:1.3;text-shadow:0 0 34px rgba(92,225,230,.35),0 4px 30px rgba(0,0,0,.55)}
.hero p{font-size:clamp(16px,1.6vw,21px);color:rgba(236,243,250,.92);max-width:620px;line-height:1.9;margin:0 0 34px;text-shadow:0 2px 16px rgba(0,0,0,.55)}
.cta{display:inline-block;background:#5CE1E6;color:#032E36;text-decoration:none;font-weight:800;padding:17px 44px;border-radius:40px;font-size:18px;box-shadow:0 14px 40px rgba(92,225,230,.35)}
.cta2{display:inline-block;margin-top:16px;color:#BFF3F5;text-decoration:none;font-size:15px}
.worlds{display:flex;gap:14px;margin-top:46px;flex-wrap:wrap;justify-content:center}
.worlds span{padding:10px 20px;border-radius:30px;font-size:14px;color:#E8F4F6;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18)}
@media (prefers-reduced-motion:reduce){#scene{height:100vh}.line,.hint{display:none}}
@media (max-width:640px){.top{padding:16px 18px}}
.poem{top:8%;font-size:clamp(28px,3.8vw,56px);line-height:1.55;letter-spacing:.2px;filter:drop-shadow(0 0 22px rgba(92,225,230,.28)) drop-shadow(0 6px 24px rgba(0,0,0,.55))}
.poem .hm{display:block}
.poem .w{display:inline-block;padding:.18em .04em;opacity:0;filter:blur(12px);transform:translateY(14px) scale(.98);background:linear-gradient(110deg,#fff 38%,#CFF7F8 48%,#EDE9FF 54%,#fff 64%);background-size:260% 100%;background-position:100% 0;-webkit-background-clip:text;background-clip:text;color:transparent}
.poem.on .w{animation:wIn 1.3s cubic-bezier(.2,.7,.2,1) forwards,shine 7s linear infinite;animation-delay:calc(var(--i)*.16s),calc(1.6s + var(--i)*.12s)}
@keyframes wIn{to{opacity:1;filter:blur(0);transform:none}}
@keyframes shine{to{background-position:-160% 0}}
.poem .sep{display:flex;align-items:center;justify-content:center;gap:12px;margin:.15em auto;opacity:0;transition:opacity 1s ease .8s}
.poem .sep:before,.poem .sep:after{content:"";height:1px;width:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75));transition:width 1.4s cubic-bezier(.2,.7,.2,1) .8s}
.poem .sep:after{background:linear-gradient(270deg,transparent,rgba(255,255,255,.75))}
.poem .sep b{font-size:.32em;color:#BFF3F5;font-weight:400}
@media (min-aspect-ratio:1/1){.poem{top:max(64px,9%);display:flex;justify-content:center;align-items:center;gap:.5em;flex-wrap:nowrap;font-size:clamp(22px,min(2.9vw,5.6vh),48px)}.poem .hm{display:inline-block;white-space:nowrap}.poem .sep{margin:0}.poem.on .sep:before,.poem.on .sep:after{width:clamp(18px,2.4vw,40px)}}
@media (max-aspect-ratio:1/1){.poem{top:calc(env(safe-area-inset-top,0px) + 78px);font-size:clamp(24px,min(7vw,4.2vh),40px)}}
.poem.on .sep{opacity:1}.poem.on .sep:before,.poem.on .sep:after{width:clamp(50px,9vw,130px)}
/* phone scene: each layer is drawn once; while scrolling the graphics chip only moves and fades them (like video) */
.world{position:absolute;inset:0;overflow:hidden;display:none;opacity:0;pointer-events:none;background:#04070f;transition:opacity .5s}
.world .L{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0;will-change:transform}
.world canvas{position:absolute;display:block;opacity:0}
#stars{position:absolute;left:0;top:0;width:0;height:0;will-change:opacity}
#stars canvas{opacity:1;animation:tw var(--d) ease-in-out var(--dl) infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
#portal{position:absolute;overflow:hidden}
.world .glow{mix-blend-mode:screen;mix-blend-mode:plus-lighter}
.vig,.scrim,.hero,.hint,.bloom{will-change:opacity,transform}
.line{will-change:opacity,transform,filter}
.bloom{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse 80% 62% at 50% 44%,rgba(255,246,226,.97) 0%,rgba(255,216,154,.78) 36%,rgba(255,180,100,.30) 66%,rgba(255,160,80,0) 100%)}
</style>
</head>
<body>
<header class="top" id="top">
  <a class="skip" href="#" id="skip">تخطَّ إلى المنصة ←</a>
</header>
<section id="scene"><div class="stick" id="stick">
  <video id="sv" muted playsinline preload="auto"></video>
  <div class="world" id="world">
    <div class="L" id="skyL"><div id="stars"></div></div>
    <div class="L" id="fgL"><div id="portal"><div class="L" id="cosL"></div></div></div>
  </div>
  <div class="bloom" id="bloom"></div>
  <div class="vig" id="vig"></div>
  <div class="line poem"><span class="hm"><span class="w" style="--i:0">وتَحْسَبُ</span> <span class="w" style="--i:1">أنَّكَ</span> <span class="w" style="--i:2">جِرْمٌ</span> <span class="w" style="--i:3">صَغِيرٌ</span></span><span class="sep"><b>✦</b></span><span class="hm"><span class="w" style="--i:4">وفِيكَ</span> <span class="w" style="--i:5">انْطَوَى</span> <span class="w" style="--i:6">العَالَمُ</span> <span class="w" style="--i:7">الأَكْبَرُ</span></span></div>
  <div class="scrim" id="scrim"></div>
  <div class="hero" id="hero">
    <h1>اكتشف عالمك، وابدأ رحلتك</h1>
    <p>منصة تساعدك على فهم نفسك، واكتشاف شغفك، ورسم طريقك بثقة؛ خطوة بخطوة.</p>
    <a class="cta" href="index.html#test">ابدأ الاختبار</a>
    <a class="cta2" href="index.html#home">تصفّح المنصة</a>
    <div class="worlds"><span>اختبار الشخصية</span><span>YouFinder</span><span>YouPartner</span><span>You</span></div>
  </div>
  <div class="hint" id="hint">اسحب للأسفل<i></i></div>
  <div class="load" id="load"><span id="bar"></span></div>
</div></section>

<script>
const $=id=>document.getElementById(id);
const sv=$('sv'),hero=$('hero'),scrim=$('scrim'),vig=$('vig'),hint=$('hint'),scene=$('scene'),load=$('load'),bar=$('bar'),stick=$('stick');
const lines=[...document.querySelectorAll('.line')];
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),ease=t=>t*t*(3-2*t),sstep=(a,b,x)=>ease(cl((x-a)/(b-a)));
const mob=matchMedia('(max-aspect-ratio:1/1)').matches;
let mode='video';            // 'img' on phones (layered photo scene), 'video' on laptops

/* ---------- shared: smoothed scroll progress ---------- */
let tgt=0,sm=0,loopOn=false,ticking=false,lt=0,step=()=>false;
function loop(t){const dt=lt?Math.min(64,t-lt):16.7;lt=t;const k=1-Math.pow(1-.16,dt/16.7);
 const d=tgt-sm;if(Math.abs(d)<.0004)sm=tgt;else sm+=d*k;
 const busy=step(sm);ui(sm);
 if(sm!==tgt||busy)requestAnimationFrame(loop);else{loopOn=false;lt=0;}}
function kick(){if(!loopOn){loopOn=true;requestAnimationFrame(loop);}}
function ui(p){
 vig.style.opacity=1-cl(p/.6);
 const hp=ease(cl((p-.74)/.16));
 hero.style.opacity=hp;hero.style.transform='translateY('+((1-hp)*24)+'px)';hero.style.pointerEvents=hp>.5?'auto':'none';
 scrim.style.opacity=hp;
 hint.style.opacity=1-cl(p/.05);
 lines.forEach(l=>{const o=1-cl((p-.1)/.14);l.style.opacity=o;l.style.filter=o<.99?'blur('+((1-o)*10).toFixed(2)+'px)':'';l.style.transform='translateY('+(-(1-o)*30)+'px) scale('+(1+(1-o)*.06)+')';});
}
function f(){const max=scene.offsetHeight-innerHeight;tgt=max>0?cl(scrollY/max):0;kick();}
addEventListener('scroll',()=>{if(!ticking){ticking=true;requestAnimationFrame(()=>{ticking=false;f();});}},{passive:true});

/* scroll stays locked until the scene is fully loaded */
const de=document.documentElement,noTouch=e=>e.preventDefault();
const lock=on=>{de.style.overflow=on?'hidden':'';document.body.style.overflow=on?'hidden':'';
 if(on)addEventListener('touchmove',noTouch,{passive:false});else removeEventListener('touchmove',noTouch);};
let released=false;
const release=()=>{if(released)return;released=true;load.style.opacity=0;setTimeout(()=>load.style.display='none',500);hint.style.visibility='visible';lock(false);f();kick();};
lock(true);load.style.display='block';hint.style.visibility='hidden';
async function getBlob(url,onp){const r=await fetch(url);if(!r.ok)throw new Error(url);const tot=+r.headers.get('content-length')||0;
 if(!r.body){const b=await r.blob();onp(b.size,b.size);return b;}
 const rd=r.body.getReader(),parts=[];let got=0;for(;;){const {done,value}=await rd.read();if(done)break;parts.push(value);got+=value.length;onp(got,tot);}return new Blob(parts);}

/* ---------- laptop: scroll-scrubbed video (unchanged) ---------- */
function startVideo(){
 mode='video';sv.style.display='block';
 const SRC=mob?'v2/scrub-m-hd.mp4':'v2/scrub-d.mp4';sv.poster=mob?'v2/poster-m.jpg':'v2/poster-d.jpg';
 const JT=7.9,JP=.72,vt=p=>{const D=sv.duration||12.04;return p<JP?(p/JP)*JT:JT+((p-JP)/(1-JP))*(D-.06-JT);};
 step=p=>{if(!sv.paused)sv.pause();if(sv.readyState<1)return false;const D=sv.duration||12.04,T=Math.min(vt(p),D-.06);
  if(sv.seeking)return true;if(Math.abs(sv.currentTime-T)>.012){if(sv.fastSeek&&Math.abs(sv.currentTime-T)>.5)sv.fastSeek(T);else sv.currentTime=T;return true;}return false;};
 sv.addEventListener('loadedmetadata',kick);
 sv.addEventListener('playing',()=>{sv.pause();kick();});
 sv.addEventListener('timeupdate',()=>{if(!sv.paused){sv.pause();kick();}});
 let finished=false;
 const finish=src=>{if(finished)return;finished=true;sv.src=src;sv.load();
  sv.addEventListener('loadeddata',release,{once:true});sv.addEventListener('canplay',release,{once:true});setTimeout(release,4000);};
 const fallback=setTimeout(()=>finish(SRC),15000);
 getBlob(SRC,(g,t)=>{if(t)bar.style.width=(g/t*100).toFixed(1)+'%';})
  .then(b=>{clearTimeout(fallback);finish(URL.createObjectURL(new Blob([b],{type:'video/mp4'})));})
  .catch(()=>{clearTimeout(fallback);finish(SRC);});
 if(mob){const done=()=>{removeEventListener('touchstart',unlock);removeEventListener('touchend',unlock);};const unlock=()=>{if(!finished)return;const p=sv.play();if(p)p.then(()=>{sv.pause();kick();done();}).catch(()=>{});else{sv.pause();kick();}};addEventListener('touchstart',unlock,{passive:true});addEventListener('touchend',unlock,{passive:true});}
}

/* ---------- phone: layered photo scene. Every layer is drawn ONCE into its own canvas;
   while scrolling only transforms/opacities change, so the GPU composites it like a video (no redraw, no re-decode) ---------- */
function startLayers(){
 mode='img';sv.style.display='none';
 const world=$('world'),skyL=$('skyL'),fgL=$('fgL'),cosL=$('cosL'),portal=$('portal'),starsEl=$('stars'),bloom=$('bloom');
 world.style.display='block';
 const A='v3/',W=941,H=1672,Q=[470.5,960],OPC=[469.5,888.5],CC=[470.5,836],PORT=[346,649.5,247,478.5];
 const NAMES=['sky','fg-lo','fg-mid','fg-hi','in-lo','in-hi','cosmos-1x','cosmos-2x','glow'];
 const EST={sky:391588,'fg-lo':345744,'fg-mid':489060,'fg-hi':399278,'in-lo':67548,'in-hi':169590,'cosmos-1x':225022,'cosmos-2x':589114,glow:30466};
 const SMAX=5,AP=.70,C0=.75,C1=1.06,SKYH=1048,D=1.66;   /* C0: the view inside starts big enough to always fill the opening */
 let R,STARS,VW=1,VH=1,Kc=1,OXc=0,OYc=0,DPR=1,S1=1.204,S2=1.806,ready=false;
 const L={},blobs={};
 const state=p=>{const t=cl(p/AP),s=1/(1-t*(1-1/SMAX)),u=cl((p-AP)/(1-AP));
   const c=t<1?C0/(1-t*(1-C0/C1)):C1*(1+.07*ease(u));return {t,s,u,c};};
 const setT=(el,a,e,f)=>{const v='matrix('+a.toFixed(6)+',0,0,'+a.toFixed(6)+','+e.toFixed(2)+','+f.toFixed(2)+')';if(el._t!==v){el._t=v;el.style.transform=v;}};
 const setO=(el,o)=>{const v=o<=.002?'0':o>=.998?'1':o.toFixed(3);if(el._o!==v){el._o=v;el.style.opacity=v;}};
 const place=(el,r)=>{el.style.left=r[0]+'px';el.style.top=r[1]+'px';el.style.width=r[2]+'px';el.style.height=r[3]+'px';};
 place(portal,PORT);   /* the opening (a plain rectangle is enough: the frame covers its corners) */
 function draw(p){
  if(!ready)return;
  const {t,s,c}=state(p),inside=s>=4.7,qx=OXc+Kc*Q[0],qy=OYc+Kc*Q[1];
  const sa=(1+.04*t)*Kc;setT(skyL,sa,qx-sa*Q[0],qy-sa*Q[1]);setO(skyL,inside?0:1);   /* sky: almost still */
  const a=s*Kc,e=qx-a*Q[0],f=qy-a*Q[1];setT(fgL,a,e,f);                              /* portal + ground: the camera moves in */
  const inA=1-sstep(1.12,1.9,s);
  if(inA<1){  /* the universe seen through the opening: far away, so it grows slower than the arch */
   const px=e+a*OPC[0],py=f+a*OPC[1],m=sstep(.5,1,t),cx=px+(VW/2-px)*m,cy=py+(VH/2-py)*m;
   const xL=Math.max(0,e+a*PORT[0]),xR=Math.min(VW,e+a*(PORT[0]+PORT[2])),yT=Math.max(0,f+a*PORT[1]),yB=Math.min(VH,f+a*(PORT[1]+PORT[3]));
   const ca=Math.max(c*Kc,1.01*Math.max((cx-xL)/CC[0],(xR-cx)/(W-CC[0]),(cy-yT)/CC[1],(yB-cy)/(H-CC[1])));  /* never smaller than the visible opening */
   setT(cosL,ca/a,(cx-ca*CC[0]-e)/a-PORT[0],(cy-ca*CC[1]-f)/a-PORT[1]);
   const hi=ca*DPR>=1.15;setO(L['cosmos-1x'],hi?0:1);setO(L['cosmos-2x'],hi?1:0);
  }else{setO(L['cosmos-1x'],0);setO(L['cosmos-2x'],0);}
  const lo=s<S1,mid=!lo&&s<S2;   /* sharper level as soon as the current one would be enlarged */
  setO(L['in-lo'],!inside&&lo?inA:0);setO(L['in-hi'],!inside&&!lo?inA:0);
  setO(L.glow,inside?0:(.35+.6*sstep(1,3.2,s))*(1-sstep(3.6,4.6,s)));
  setO(L['fg-lo'],!inside&&lo?1:0);setO(L['fg-mid'],!inside&&mid?1:0);setO(L['fg-hi'],!inside&&!lo&&!mid?1:0);
  setO(starsEl,1-sstep(2.6,4.2,s));
  setO(bloom,sstep(.53,.64,p)*(1-sstep(.67,.77,p))*.62);
 }
 function size(){DPR=Math.min(devicePixelRatio||1,3);VW=stick.clientWidth;VH=stick.clientHeight;
  Kc=Math.max(VW/W,VH/H);OXc=(VW-W*Kc)/2;OYc=(VH-H*Kc)/2;const KD=Kc*DPR;S1=Math.max(1.204,2/KD);S2=Math.max(1.806,3/KD);draw(sm);}
 let lastW=0;addEventListener('resize',()=>{if(innerWidth===lastW)return;lastW=innerWidth;size();});
 step=p=>{draw(p);return false;};
 const paint=async n=>{  /* decode once (off the main thread when possible) and draw once */
  const c=L[n],b=blobs[n];let src,done=()=>{};
  if(self.createImageBitmap){src=await createImageBitmap(b);done=()=>{if(src.close)src.close();};}
  else{const u=URL.createObjectURL(b);src=new Image();src.src=u;await src.decode();done=()=>URL.revokeObjectURL(u);}
  c.width=src.width;c.height=src.height;c.getContext('2d',{alpha:!(n==='sky'||n.startsWith('cosmos'))}).drawImage(src,0,0);done();};
 const paintStars=()=>{const G=[...starsEl.children];
  for(const c of G){c.width=Math.round(W*D);c.height=Math.round(SKYH*D);}
  STARS.forEach((S,i)=>{const x=G[i%G.length].getContext('2d'),px=S[0]*D,py=S[1]*D,r=S[2]*.95*D,col=S[5]?'212,230,255':'255,255,255';
   const g=x.createRadialGradient(px,py,0,px,py,r*2.4);g.addColorStop(0,'rgba('+col+',.32)');g.addColorStop(1,'rgba('+col+',0)');   /* faint glow */
   x.fillStyle=g;x.beginPath();x.arc(px,py,r*2.4,0,6.2832);x.fill();
   x.fillStyle='rgb('+col+')';x.beginPath();x.arc(px,py,r,0,6.2832);x.fill();                                                       /* crisp core */
   if(S[2]>1.25){x.fillStyle='rgba('+col+',.45)';const Ls=r*3.4,w=1.1;x.fillRect(px-Ls,py-w/2,2*Ls,w);x.fillRect(px-w/2,py-Ls,w,2*Ls);}});};
 (async()=>{
  const meta=await (await fetch(A+'scene.json')).json();R=meta.R;STARS=meta.stars;
  const mk=(n,parent,before)=>{const c=document.createElement('canvas');place(c,R[n]);parent.insertBefore(c,before||null);L[n]=c;return c;};
  mk('sky',skyL,starsEl).style.opacity='1';                       /* bottom to top */
  for(let i=0;i<3;i++){const c=document.createElement('canvas');place(c,[0,0,W,SKYH]);   /* 3 groups, each on its own rhythm */
   c.style.setProperty('--d',[2.6,3.7,4.9][i]+'s');c.style.setProperty('--dl',(-1.7*i)+'s');starsEl.appendChild(c);
   c.addEventListener('contextrestored',paintStars);}
  mk('cosmos-1x',cosL);mk('cosmos-2x',cosL);
  for(const n of ['in-lo','in-hi','glow','fg-lo','fg-mid','fg-hi'])mk(n,fgL);L.glow.className='glow';
  const prog={},upd=()=>{let g=0,tt=0;for(const n of NAMES){const q=prog[n]||[0,0];g+=q[0];tt+=q[1]||EST[n];}bar.style.width=(g/tt*100).toFixed(1)+'%';};
  await Promise.all(NAMES.map(async n=>{blobs[n]=await getBlob(A+n+'.webp',(g,t)=>{prog[n]=[g,t];upd();});await paint(n);}));
  paintStars();
  for(const n of NAMES)L[n].addEventListener('contextrestored',()=>paint(n));   /* if the system ever drops a layer, draw it again */
  ready=true;lastW=innerWidth;size();
  requestAnimationFrame(()=>{world.style.opacity='1';release();});
 })().catch(err=>{console.error(err);world.style.display='none';startVideo();});
}

if(mob)startLayers();else startVideo();
addEventListener('resize',f);
$('skip').addEventListener('click',()=>lock(false));
$('skip').addEventListener('click',e=>{e.preventDefault();scrollTo({top:scene.offsetHeight-innerHeight,behavior:'smooth'});});
f();setTimeout(()=>lines.forEach(l=>l.classList.add('on')),350);
</script>
</body>
</html>
