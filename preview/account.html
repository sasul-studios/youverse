.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg button{height:50px;border:1px solid var(--line);border-radius:14px;background:#fff;font:inherit;font-weight:700;color:var(--ink2);cursor:pointer}
.seg button.on{border-color:var(--teal);background:#E6F8F9;color:var(--ink)}

.btn:hover{filter:brightness(1.07)}.btn[disabled]{opacity:.55;cursor:default}
.err{min-height:20px;color:#B3263E;font-size:14px;line-height:1.6}
.ok{background:#E3F6EA;color:#17713A;border-radius:14px;padding:14px 16px;line-height:1.8;font-size:15px}
.pw{position:relative}.pw button{position:absolute;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--mut);cursor:pointer;font:inherit;font-size:13px;right:12px}html[dir=rtl] .pw button{right:auto;left:12px}.pw input{padding-right:72px}html[dir=rtl] .pw input{padding-right:16px;padding-left:72px}

.lang{position:fixed;top:16px;inset-inline-end:18px;font-family:Lora,serif;font-weight:600;text-decoration:none;color:var(--ink2);border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;font-size:14px}
