<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YouFinder - Youverse</title>
<link rel="icon" href="img/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Almarai:wght@400;700;800&family=Lora:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="img/logo-h128.webp">
<script>window.YV_LOGO='img/logo-h128.webp';</script>
<style>
*{box-sizing:border-box}html,body{margin:0;overflow-x:clip;overscroll-behavior-y:none}
html{background:#03060E}
body{background:#03060E;color:#EAF4F6;font-family:Almarai,sans-serif;min-height:100vh}
.ys{background:rgba(255,255,255,.94)!important}
h1,h2,h3,.serif{font-family:Amiri,serif;font-weight:700}
html[lang=en] h1,html[lang=en] h2,html[lang=en] h3,html[lang=en] .serif{font-family:Lora,serif}
a{color:inherit}button{font:inherit;color:inherit}

/* ===== the sky: stars drawn once on canvases; the camera moves the layers ===== */
#sky{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 80% 60% at 70% 10%,rgba(60,90,160,.16),transparent 60%),radial-gradient(ellipse 60% 50% at 10% 80%,rgba(120,70,150,.12),transparent 60%),#03060E;transition:opacity 1.6s ease}
#sky .sl{position:absolute;inset:0;will-change:transform}
#sky canvas{position:absolute;left:-6%;top:-6%;width:112%;height:112%}
#s1{animation:drift 140s linear infinite alternate}#s2{animation:drift 90s linear infinite alternate-reverse;opacity:.9}
#s3{animation:tw 5s ease-in-out infinite}
@keyframes drift{to{transform:translate3d(-2.5%,1.5%,0)}}@keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}
body.cold #sky{opacity:0}

/* ===== the journey: a sticky stage, the page scroll drives the camera ===== */
#journey{position:relative;z-index:1}
#stage{position:sticky;top:var(--hh,64px);height:calc(100vh - var(--hh,64px));height:calc(100svh - var(--hh,64px));overflow:hidden;isolation:isolate;user-select:none;-webkit-user-select:none}
.neb{position:absolute;inset:-8%;opacity:0;visibility:hidden;pointer-events:none;will-change:opacity;
 background:radial-gradient(ellipse 46% 52% at var(--nx,34%) 56%,color-mix(in srgb,var(--c) 26%,transparent),color-mix(in srgb,var(--c) 8%,transparent) 55%,transparent 75%),
            radial-gradient(ellipse 34% 30% at calc(var(--nx,34%) + 34%) 26%,color-mix(in srgb,var(--c) 13%,transparent),transparent 72%)}
#warp{position:absolute;inset:0;width:100%;height:100%;opacity:0;visibility:hidden;pointer-events:none;will-change:transform,opacity;mix-blend-mode:screen}
.shoot{position:absolute;width:130px;height:1.5px;border-radius:2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.9));opacity:0;pointer-events:none;transform-origin:100% 50%;animation:shoot var(--d) linear var(--w) infinite}
@keyframes shoot{0%{opacity:0;transform:rotate(var(--r)) translateX(0)}1.5%{opacity:1}7%{opacity:0;transform:rotate(var(--r)) translateX(var(--l))}100%{opacity:0;transform:rotate(var(--r)) translateX(var(--l))}}
#world{position:absolute;inset:0;transform-origin:50% 50%}
#world.zoom{transition:transform 1s cubic-bezier(.22,.8,.2,1)}

/* planets (one image each, rendered for this site) */
.pl{position:absolute;left:0;top:0;padding:0;border:0;background:none;border-radius:50%;cursor:pointer;will-change:transform,opacity;-webkit-tap-highlight-color:transparent;outline:none}
.pl .pi{position:absolute;inset:0;transition:opacity 1.2s ease,transform 1.6s cubic-bezier(.2,.8,.2,1)}
.pl:not(.lit) .pi{opacity:0;transform:scale(.5)}
.pl img{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none}
html[dir=ltr] .pl img{transform:scaleX(-1)}
.pl .fl{position:absolute;inset:20%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.9),color-mix(in srgb,var(--c) 60%,transparent) 40%,transparent 70%);opacity:0;pointer-events:none}
.pl.lit .fl{animation:flash 1.3s ease-out}
@keyframes flash{0%{opacity:0;transform:scale(.3)}20%{opacity:.9}100%{opacity:0;transform:scale(1.6)}}
.pl .bc{position:absolute;inset:18%;border-radius:50%;border:3px solid var(--c);opacity:0;pointer-events:none}
#stage.ov .pl.mine .bc{animation:beacon 2.6s ease-out infinite}
@keyframes beacon{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.7)}}
.pl:focus-visible .pi{filter:drop-shadow(0 0 18px var(--c))}
.plab{position:absolute;left:0;top:0;transform-origin:50% 0;pointer-events:none;text-align:center;white-space:nowrap;will-change:transform,opacity}
.plab b{display:block;font-family:Amiri,serif;font-size:19px;color:#fff;text-shadow:0 2px 14px #000}
html[lang=en] .plab b{font-family:Lora,serif;font-size:16px}
.plab[data-m=r]{text-align:left}.plab[data-m=l]{text-align:right}
.plab small{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;color:var(--c)}
.plab em{font-style:normal;font-size:10.5px;background:var(--c);color:#03060E;border-radius:20px;padding:1px 8px;margin-inline-start:4px}
.ring{position:absolute;left:0;top:0;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--c) 60%,transparent);pointer-events:none;will-change:transform,opacity;box-shadow:0 0 22px -6px color-mix(in srgb,var(--c) 70%,transparent)}
.ring.f{clip-path:inset(50% 0 0 0)}

/* characters orbiting their world */
.orb{position:absolute;left:0;top:0;width:var(--a);height:var(--a);padding:0;border:0;background:none;cursor:pointer;will-change:transform,opacity;-webkit-tap-highlight-color:transparent;outline:none}
.orb i{display:flex;align-items:center;justify-content:center;width:100%;height:100%;border-radius:50%;font-style:normal;font-family:Amiri,serif;font-weight:700;font-size:calc(var(--a) * .42);color:#fff;background:radial-gradient(circle at 50% 35%,#1A2C42,#070D18 75%);border:2px solid var(--c);box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 14%,transparent),0 0 26px -2px var(--c);overflow:hidden;position:relative;transition:box-shadow .3s}
.orb i img{width:100%;height:100%;object-fit:cover}
.orb span{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:8px;white-space:nowrap;font-size:13px;color:rgba(234,244,246,.88);text-shadow:0 1px 10px #000,0 0 2px #000}
.orb:hover i,.orb:focus-visible i{box-shadow:0 0 0 8px color-mix(in srgb,var(--c) 28%,transparent),0 0 44px 4px var(--c)}
.orb.sel i:after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--c);animation:burst 1.2s ease-out .3s both}
@keyframes burst{from{transform:scale(1);opacity:.9}to{transform:scale(2.2);opacity:0}}

/* title cards */
.tc{position:absolute;z-index:30;pointer-events:none;inset-inline-start:6%;top:50%;transform:translateY(-50%);width:min(36%,480px)}
.tc.ov{top:13%;transform:none;width:min(46%,600px)}
.tc > *{opacity:0;transform:translateY(22px);transition:opacity .35s ease,transform .5s ease}
.tc.on > *{opacity:1;transform:none;transition:opacity .9s ease,transform 1.1s cubic-bezier(.2,.8,.2,1)}
.tc.on > :nth-child(2){transition-delay:.1s}.tc.on > :nth-child(3){transition-delay:.2s}.tc.on > :nth-child(4){transition-delay:.32s}.tc.on > :nth-child(5){transition-delay:.44s}
body.cold .tc > *{opacity:0!important}
.tc .num{display:flex;align-items:center;gap:12px;font-family:Lora,serif;font-size:14px;letter-spacing:.18em;color:rgba(234,244,246,.5)}
.tc .num b{color:var(--c);font-weight:600}.tc .num i{width:64px;height:1px;background:linear-gradient(90deg,var(--c),transparent)}
html[dir=rtl] .tc .num i{background:linear-gradient(270deg,var(--c),transparent)}
.tc .lt{display:flex;align-items:center;gap:8px;color:var(--c);font-weight:800;font-size:14.5px;margin-top:20px}
.tc .lt em{font-style:normal;font-size:11.5px;background:var(--c);color:#03060E;border-radius:20px;padding:3px 10px;margin-inline-start:4px}
.tc h1,.tc h2{margin:6px 0 0;color:#fff;line-height:1.25;text-shadow:0 0 50px color-mix(in srgb,var(--c,#5CE1E6) 45%,transparent)}
.tc h1{font-size:clamp(48px,5.6vw,88px)}.tc h2{font-size:clamp(44px,4.8vw,76px)}
.tc p{font-size:17px;line-height:1.9;color:rgba(234,244,246,.78);margin:14px 0 0;max-width:460px}
.tc .cnt{display:flex;align-items:center;gap:9px;margin-top:20px;font-size:14px;color:rgba(234,244,246,.62)}
.tc .cnt i{width:7px;height:7px;border-radius:50%;background:var(--c,#5CE1E6);box-shadow:0 0 10px var(--c,#5CE1E6);flex:none}

/* star chart (navigation) */
#rail{position:absolute;z-index:40;inset-inline-end:26px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:12px}
#rail:before{content:"";position:absolute;top:16px;bottom:16px;left:50%;width:1px;background:linear-gradient(transparent,rgba(234,244,246,.2),transparent);z-index:-1}
#rail button{position:relative;width:36px;height:36px;border-radius:50%;border:1px solid rgba(234,244,246,.2);background:rgba(6,11,22,.72);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .35s cubic-bezier(.2,.8,.2,1),border-color .3s,box-shadow .3s;padding:0;--c:#5CE1E6}
#rail button svg{opacity:.7}
#rail button[aria-current=true]{transform:scale(1.22);border-color:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 18%,transparent),0 0 18px -2px var(--c)}
#rail button[aria-current=true] svg{opacity:1}
#rail .tt{position:absolute;inset-inline-end:48px;top:50%;transform:translateY(-50%);white-space:nowrap;font-size:13px;font-weight:700;background:rgba(6,11,22,.85);border:1px solid rgba(234,244,246,.12);padding:6px 12px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s}
#rail button:hover .tt,#rail button:focus-visible .tt{opacity:1}
.vt{position:absolute;z-index:40;top:18px;inset-inline-end:22px}
.view{display:flex;padding:4px;border-radius:30px;border:1px solid rgba(234,244,246,.18);background:rgba(6,11,22,.6)}
.view button{border:0;background:none;height:34px;padding:0 16px;border-radius:30px;font-weight:700;font-size:13px;cursor:pointer;color:rgba(234,244,246,.7)}
.view button[aria-pressed=true]{background:rgba(234,244,246,.14);color:#fff}
.hint{position:absolute;z-index:30;bottom:26px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;font-size:13px;color:rgba(234,244,246,.72);transition:opacity .5s;pointer-events:none}
.hint i{width:1.5px;height:38px;border-radius:2px;background:linear-gradient(#5CE1E6,transparent);transform-origin:top;animation:hint 2s ease-in-out infinite}
@keyframes hint{0%{transform:scaleY(0);opacity:1}55%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1);opacity:0}}
body.cold .hint{opacity:0!important}

/* close-up: letterbox and caption */
.lb{position:absolute;left:0;right:0;z-index:50;background:#000;transition:transform .9s cubic-bezier(.22,.8,.2,1)}
.lb.t{top:0;height:11%;transform:translateY(-102%)}
.lb.b{bottom:0;height:22%;transform:translateY(102%)}
#stage.focus .lb{transform:none}
#cap{position:absolute;z-index:55;left:0;right:0;bottom:0;height:22%;display:flex;align-items:center;justify-content:center;gap:34px;padding:0 7%;opacity:0;transform:translateY(16px);transition:opacity .4s,transform .5s;pointer-events:none}
#stage.focus #cap{opacity:1;transform:none;pointer-events:auto;transition:opacity .7s .35s,transform .9s .35s cubic-bezier(.2,.8,.2,1)}
#cap .tx{max-width:560px}
#cap .nm{font-family:Amiri,serif;font-weight:700;font-size:36px;color:#fff;line-height:1.25}
html[lang=en] #cap .nm{font-family:Lora,serif;font-size:30px}
#cap small{display:block;color:rgba(234,244,246,.72);font-size:15px;line-height:1.7;margin-top:2px}
#cap .lt{display:inline-flex;align-items:center;gap:7px;color:var(--c);font-size:13px;font-weight:800}
#cap a{display:inline-flex;align-items:center;gap:8px;flex:none;text-decoration:none;background:var(--c);color:#03060E;font-weight:800;font-size:15px;padding:14px 26px;border-radius:30px;box-shadow:0 10px 40px -10px var(--c)}
#cap .x{position:absolute;top:14px;inset-inline-end:18px;width:38px;height:38px;border-radius:50%;border:1px solid rgba(234,244,246,.2);background:rgba(255,255,255,.06);cursor:pointer;font-size:18px;line-height:1}
#stage.focus .orb:not(.sel),#stage.focus .pl,#stage.focus .ring,#stage.focus .plab{opacity:.14!important;transition:opacity .6s}
#stage.focus .tc,#stage.focus #rail,#stage.focus .vt,#stage.focus .hint{opacity:0;pointer-events:none;transition:opacity .4s}
#stage .tc,#rail,.vt{transition:opacity .5s}

/* film look: vignette, grain, an anamorphic flare when a world arrives */
#vig{position:absolute;inset:0;z-index:35;pointer-events:none;background:radial-gradient(ellipse 75% 70% at 50% 50%,transparent 55%,rgba(0,0,0,.55) 100%)}
#grain{position:absolute;inset:-60px;z-index:36;pointer-events:none;background:url(img/worlds/grain.webp);opacity:.5;animation:grain 1.2s steps(5) infinite;will-change:transform}
@keyframes grain{0%{transform:translate(0,0)}17%{transform:translate(-31px,17px)}33%{transform:translate(22px,-41px)}50%{transform:translate(-43px,-12px)}67%{transform:translate(37px,29px)}83%{transform:translate(-9px,46px)}100%{transform:translate(12px,-23px)}}
#flare{position:absolute;z-index:34;left:0;top:0;width:var(--fw,600px);height:120px;margin:-60px 0 0 calc(var(--fw,600px) / -2);pointer-events:none;opacity:0;
 background:radial-gradient(ellipse 50% 3% at 50% 50%,rgba(255,255,255,.95),transparent 70%),radial-gradient(ellipse 18% 9% at 50% 50%,color-mix(in srgb,var(--c,#5CE1E6) 70%,transparent),transparent 70%),radial-gradient(circle 26px at 50% 50%,rgba(255,255,255,.9),transparent 70%)}
#flare.go{animation:flare 2.4s cubic-bezier(.2,.8,.2,1)}
@keyframes flare{0%{opacity:0;transform:scaleX(.15)}22%{opacity:.95;transform:scaleX(1)}100%{opacity:0;transform:scaleX(1.25)}}
#hero{position:absolute;left:0;top:0;z-index:45;width:var(--ha,200px);height:var(--ha,200px);pointer-events:none;opacity:0;transform-origin:0 0;visibility:hidden}
#hero.on{opacity:1;visibility:visible}
#hero i{display:flex;align-items:center;justify-content:center;width:100%;height:100%;border-radius:50%;font-style:normal;font-family:Amiri,serif;font-weight:700;font-size:calc(var(--ha,200px) * .42);color:#fff;background:radial-gradient(circle at 50% 35%,#1A2C42,#070D18 75%);border:3px solid var(--c);box-shadow:0 0 0 10px color-mix(in srgb,var(--c) 16%,transparent),0 0 70px 4px var(--c);overflow:hidden;position:relative}
#hero i img{width:100%;height:100%;object-fit:cover}
#hero.on i:after{content:"";position:absolute;inset:-4px;border-radius:50%;border:3px solid var(--c);animation:burst 1.3s ease-out .5s both}
.orb.sel{visibility:hidden!important}
@media (prefers-reduced-motion:reduce){#grain,#flare{animation:none!important;display:none}}

/* the end of the journey */
#outro{position:relative;z-index:1;padding:110px 24px 140px;text-align:center}
#outro h3{font-size:clamp(32px,3.8vw,54px);margin:0;color:#fff;line-height:1.3}
#outro p{margin:14px auto 0;max-width:560px;color:rgba(234,244,246,.72);font-size:16.5px;line-height:1.9}
#outro .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:28px}
.btn{display:inline-flex;align-items:center;gap:8px;height:50px;padding:0 26px;border-radius:30px;border:1px solid rgba(234,244,246,.22);background:rgba(255,255,255,.04);text-decoration:none;font-weight:700;font-size:15px;cursor:pointer;color:#EAF4F6}
.btn.p{background:#5CE1E6;border-color:#5CE1E6;color:#032E36}

/* list view (client, Nov 2026): every character as a large face */
#listMain{display:none;position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:48px 32px 90px}
body.listing #listMain{display:block}body.listing #journey,body.listing #outro{display:none}
.top h1{font-size:clamp(40px,5vw,64px);margin:0;line-height:1.25;color:#fff;text-shadow:0 0 40px rgba(92,225,230,.25)}
.top p{margin:10px 0 0;color:rgba(234,244,246,.72);font-size:17px;line-height:1.8;max-width:640px}
.ctrl{display:flex;justify-content:flex-start;margin:26px 0 34px}
.faces{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:28px 18px}
.faces a{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;text-decoration:none;color:#EAF4F6;padding:6px;border-radius:20px;outline:none}
.faces .fc{width:132px;height:132px;border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 50% 35%,#16263A,#0B1626);border:2px solid var(--c);box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 12%,transparent),0 0 30px -8px var(--c);font-family:Amiri,serif;font-weight:700;font-size:44px;color:#fff;transition:transform .25s,box-shadow .25s}
.faces .fc img{width:100%;height:100%;object-fit:cover}
.faces a:hover .fc,.faces a:focus-visible .fc{transform:scale(1.05);box-shadow:0 0 0 8px color-mix(in srgb,var(--c) 22%,transparent),0 0 36px -4px var(--c)}
.faces b{font-size:16px;margin-top:6px}.faces small{color:rgba(234,244,246,.62);font-size:13px;line-height:1.6}
.list .none{color:rgba(234,244,246,.5);font-size:14px}

@media (max-width:760px){
 .tc,.tc.ov{inset-inline:20px;top:64px;transform:none;width:auto}
 .tc h1{font-size:44px}.tc h2{font-size:38px}
 .tc p{font-size:14.5px;line-height:1.8;margin-top:8px}
 .tc .lt{margin-top:12px;font-size:13px}.tc .cnt{margin-top:10px;font-size:12.5px}
 .tc .num{font-size:12px}.tc .num i{width:44px}
 .plab b{font-size:17px}.plab small{font-size:11.5px}
 #stage.short .tc.ov p,#stage.short .tc p{display:none}#stage.short .tc h1{font-size:38px}#stage.short .tc h2{font-size:32px}
 .vt{top:14px;inset-inline-end:14px}.view button{height:30px;padding:0 12px;font-size:12px}
 #rail{inset-inline-end:auto;left:50%;top:auto;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);flex-direction:row;gap:8px;padding:6px 10px;border-radius:30px;background:rgba(6,11,22,.7);border:1px solid rgba(234,244,246,.1)}
 #rail:before{display:none}#rail .tt{display:none}
 #rail button{width:32px;height:32px}
 .hint{bottom:calc(66px + env(safe-area-inset-bottom))}.hint i{display:none}
 .lb.t{height:8%}.lb.b,#cap{height:34%}
 #cap{flex-direction:column;justify-content:center;gap:14px;text-align:center;padding:0 22px}
 #cap .nm{font-size:30px}#cap small{font-size:14px}
 #listMain{padding:30px 16px 70px}.top p{font-size:15.5px}
 .faces{grid-template-columns:repeat(2,1fr);gap:22px 12px}.faces .fc{width:112px;height:112px;font-size:38px}
}
@media (prefers-reduced-motion:reduce){#sky canvas,.shoot,.hint i,.pl .bc,.orb.sel i:after{animation:none!important}.shoot{display:none}}
</style>
</head>
<body class="cold">
<div id="sky"><div class="sl" id="sl1"><canvas id="s1"></canvas></div><div class="sl" id="sl2"><canvas id="s2"></canvas></div><div class="sl" id="sl3"><canvas id="s3"></canvas></div></div>
<div id="yv-shell" data-page="finder"></div>

<div id="journey">
 <div id="stage" class="ov">
  <div id="nebs"></div>
  <canvas id="warp" aria-hidden="true"></canvas>
  <div id="shoots" aria-hidden="true"></div>
  <div id="world"></div>
  <div id="flare" aria-hidden="true"></div>
  <div id="vig" aria-hidden="true"></div><div id="grain" aria-hidden="true"></div>
  <div id="hero" aria-hidden="true"><i></i></div>
  <div id="titles"></div>
  <div class="hint" id="hint"><span id="hintT"></span><i></i></div>
  <nav id="rail" aria-label="map"></nav>
  <div class="vt"><div class="view" role="group"><button data-v="space" aria-pressed="true"></button><button data-v="list" aria-pressed="false"></button></div></div>
  <div class="lb t"></div><div class="lb b"></div>
  <div id="cap" role="dialog" aria-modal="false"><button class="x" id="capX" type="button">×</button><div class="tx"><div class="lt" id="capL"></div><div class="nm" id="capN"></div><small id="capS"></small></div><a id="capGo" href="#"></a></div>
 </div>
</div>
<section id="outro"><h3 id="oH"></h3><p id="oP"></p><div class="btns" id="oB"></div></section>

<main id="listMain">
 <div class="top"><h1 id="h1"></h1><p id="sub"></p></div>
 <div class="ctrl"><div class="view" role="group"><button data-v="space" aria-pressed="false"></button><button data-v="list" aria-pressed="true"></button></div></div>
 <div class="list" id="list"></div>
</main>

<script src="test-data.js"></script>
<script src="yv-icons.js"></script>
<script src="yv-shell.js"></script>
<script>
const SH=window.YV_SHELL,en=SH.en,lang=en?'en':'ar',D=window.YV_TEST,L=D[lang].lights,C=D.COLORS,ORDER=['H','F','O','S','C'];
document.documentElement.lang=lang;document.documentElement.dir=en?'ltr':'rtl';

const LBM=[];
function placeNames(targets,s1,cz0){
 const rel=e=>{const r=e.getBoundingClientRect(),s=stage.getBoundingClientRect();return {x:r.left-s.left,y:r.top-s.top,r:r.right-s.left,b:r.bottom-s.top};};

/* ---------- camera ---------- */
const qStart=()=>$('#journey').offsetTop-hh;
function targetC(){if(!seg)return 0;const q=(scrollY-qStart())/seg;if(q<=0)return 0;const a=.2,i=Math.floor(q);if(i>=N)return N;const t=clamp((q-i-a)/(1-2*a));return i+t*t*(3-2*t);}

let skyKey='',c=0,cPrev=0,vs=0,roll=0,camXPrev=null,tOrb=0,paused=false,mx=0,my=0,pmx=0,pmy=0,focus=null,running=false,last=0,active=-1;
const SL=[$('#sl1'),$('#sl2'),$('#sl3')],WARP=$('#warp');

 const dt=clamp(last?(now-last)/1000:.016,.001,.05);last=now;

   const lo=o*clamp(1-c*3)*(LIT[j]?clamp((now-LIT[j])/900):0);LB[j].style.visibility=lo>.01?'':'hidden';if(lo>.01){LB[j].style.opacity=lo.toFixed(3);const m=LBM[j]||'b',rr=R*s;LB[j].style.transform=m==='b'?`translate3d(calc(${sx.toFixed(1)}px - 50%),${(sy+rr*1.12+6).toFixed(1)}px,0)`:m==='a'?`translate3d(calc(${sx.toFixed(1)}px - 50%),calc(${(sy-rr*1.12-6).toFixed(1)}px - 100%),0)`:m==='r'?`translate3d(${(sx+rr*1.15+8).toFixed(1)}px,calc(${sy.toFixed(1)}px - 50%),0)`:`translate3d(calc(${(sx-rr*1.15-8).toFixed(1)}px - 100%),calc(${sy.toFixed(1)}px - 50%),0)`;}}

/* ---------- moving the camera to a station ---------- */
let tween=null;

 clearTimeout(mt);mt=setTimeout(()=>{if(tween||focus||document.body.classList.contains('listing'))return;const q=(scrollY-qStart())/seg;if(q<=0||q>=N)return;const i=Math.floor(q),u=q-i;if(u>.2&&u<.8)flyTo(u<.5?i:i+1);},420);},{passive:true});
RAIL.forEach(b=>b.onclick=()=>flyTo(+b.dataset.j));
PL.forEach((p,j)=>p&&(p.onclick=()=>{if(Math.round(c)!==j)flyTo(j);}));
const ob=$('#oBack');if(ob)ob.onclick=()=>flyTo(1);
if(matchMedia('(pointer:fine)').matches)stage.addEventListener('pointermove',e=>{const r=stage.getBoundingClientRect();mx=(e.clientX-r.left)/r.width*2-1;my=(e.clientY-r.top)/r.height*2-1;kick();});

/* ---------- close-up on a character ---------- */
function openFocus(q){if(focus)unfocus(true);focus=q;paused=true;focusY=scrollY;
 const HA=mob?150:210,Fx=W/2,Fy=mob?Hh*.33:Hh*.40,hero=$('#hero');
 hero.style.setProperty('--ha',HA+'px');hero.style.setProperty('--c',C[q.k]);hero.querySelector('i').innerHTML=face(q.p);
 const vs0=A*q.s;hero.style.transition='none';hero.style.transform=`translate(${(q.x-vs0/2).toFixed(1)}px,${(q.y-vs0/2).toFixed(1)}px) scale(${(vs0/HA).toFixed(4)})`;
 hero.classList.add('on');q.el.classList.add('sel');void hero.offsetWidth;
 hero.style.transition=RM?'none':'transform 1s cubic-bezier(.22,.8,.2,1)';hero.style.transform=`translate(${(Fx-HA/2).toFixed(1)}px,${(Fy-HA/2).toFixed(1)}px) scale(1)`;
 stage.classList.add('focus');
 const Z=1.22;world.classList.add('zoom');world.style.transform=`translate(${(Fx-W/2-Z*(q.x-W/2)).toFixed(1)}px,${(Fy-Hh/2-Z*(q.y-Hh/2)).toFixed(1)}px) scale(${Z})`;
 $('#cap').style.setProperty('--c',C[q.k]);$('#capL').innerHTML=`${YVI(q.k,14)}${L[q.k].world}`;$('#capN').textContent=q.p.name;$('#capS').textContent=q.p.line;
 const go=$('#capGo');go.href=q.p.href;go.innerHTML=T.go+' '+YVI('play',12,'#03060E',2.4);YVLater($('#cap'),en);
 setTimeout(()=>go.focus({preventScroll:true}),RM?0:700);}
function unfocus(quick){if(!focus)return;const q=focus;focus=null;stage.classList.remove('focus');const hero=$('#hero');
 world.style.transform='';
 if(quick||RM){hero.classList.remove('on');q.el.classList.remove('sel');world.classList.remove('zoom');paused=false;kick();return;}
 const vs0=A*q.s;hero.style.transform=`translate(${(q.x-vs0/2).toFixed(1)}px,${(q.y-vs0/2).toFixed(1)}px) scale(${(vs0/(mob?150:210)).toFixed(4)})`;
 setTimeout(()=>{if(focus)return;hero.classList.remove('on');q.el.classList.remove('sel');world.classList.remove('zoom');paused=false;kick();},1000);
 q.el.focus({preventScroll:true});}
world.addEventListener('click',e=>{const b=e.target.closest('.orb');if(!b)return;const q=OR[+b.dataset.j][+b.dataset.i];if(focus===q)return;openFocus(q);});
$('#capX').onclick=()=>unfocus();
$$('.lb').forEach(l=>l.onclick=()=>unfocus());
addEventListener('keydown',e=>{if(e.key==='Escape')unfocus();});
world.addEventListener('pointerover',e=>{if(e.target.closest('.orb'))paused=true;});
world.addEventListener('pointerout',e=>{if(e.target.closest('.orb')&&!focus)paused=false;});

/* ---------- list view ---------- */
function renderList(){const ppl=ORDER.flatMap(k=>PEOPLE[k].map(p=>({...p,k})));
 $('#list').innerHTML=ppl.length?`<ul class="faces">${ppl.map(p=>`<li><a href="${p.href}" style="--c:${C[p.k]}"><span class="fc">${face(p)}</span><b>${p.name}</b><small>${p.line}</small></a></li>`).join('')}</ul>`:`<div class="none">${T.none}</div>`;YVLater($('#list'),en);}
renderList();
function setView(l){unfocus(true);document.body.classList.toggle('listing',l);$$('.view button').forEach(b=>b.setAttribute('aria-pressed',(b.dataset.v==='list')===l));scrollTo(0,0);if(!l){layout();kick();}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(b)setView(b.dataset.v==='list');});

/* ---------- stars: light on phones, drawn once ---------- */
(function(){const m=innerWidth<760,dpr=Math.min(devicePixelRatio||1,m?1.5:2);const NS=m?[90,40,22]:[220,90,45];
 ['s1','s2','s3'].forEach((id,j)=>{const cv=document.getElementById(id),w=innerWidth*1.12,h=innerHeight*1.12;cv.width=w*dpr;cv.height=h*dpr;const x=cv.getContext('2d');x.scale(dpr,dpr);
  let seed=7+j*31;const r=()=>(seed=(seed*9301+49297)%233280)/233280;
  for(let i=0;i<NS[j];i++){const px=r()*w,py=r()*h,s=j===0?r()*.9+.3:j===1?r()*1.1+.5:r()*1.4+.8,a=j===0?.35+r()*.4:.6+r()*.4;
   const col=r()<.18?'190,215,255':r()<.1?'255,220,235':'255,255,255';
   if(j>0){const g=x.createRadialGradient(px,py,0,px,py,s*4);g.addColorStop(0,'rgba('+col+','+(a*.35)+')');g.addColorStop(1,'rgba('+col+',0)');x.fillStyle=g;x.beginPath();x.arc(px,py,s*4,0,6.283);x.fill();}
   x.fillStyle='rgba('+col+','+a+')';x.beginPath();x.arc(px,py,s,0,6.283);x.fill();}});})();

layout();kick();

let rz=null;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(!document.body.classList.contains('listing')){layout();kick();}},150);});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)kick();});
(function(){let seen=false;try{seen=sessionStorage.getItem('yvFinderOpen')==='1';sessionStorage.setItem('yvFinderOpen','1');}catch(e){}
 const lightAll=()=>{PL.forEach((p,j)=>{if(p){p.classList.add('lit');LIT[j]=performance.now()-900;}});document.body.classList.remove('cold');kick();};
 if(seen||RM||scrollY>10){lightAll();return;}
 setTimeout(()=>{document.body.classList.remove('cold');kick();},250);
 order.forEach((k,idx)=>setTimeout(()=>{PL[idx+1].classList.add('lit');LIT[idx+1]=performance.now()+500;kick();},900+idx*230));})();
